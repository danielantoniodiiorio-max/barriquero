name: Compilar APK Android
on: [push, workflow_dispatch]
jobs:
  build:
    name: Compilar APK Android 15 con Health Connect
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 21 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Configurar Dependencias y Assets
        run: |
          if [ -d "keto-tracker" ]; then
            cd keto-tracker
          fi

          # 1. Configurar dependencias de Capacitor 7 y Health Connect
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.dependencies = {
              '@capacitor/core': '^7.0.0',
              '@capacitor/android': '^7.0.0',
              '@capgo/capacitor-health': '^7.2.1'
            };
            pkg.devDependencies = {
              '@capacitor/cli': '^7.0.0'
            };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

          # 2. Generar Política de Privacidad para Health Connect
          cat << 'EOF' > public/privacypolicy.html
          <!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Privacidad - KetoTrack</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 24px; line-height: 1.6; color: #222; max-width: 680px; margin: auto; background: #fafafa; }
              h1 { color: #059669; }
              .card { background: white; padding: 20px; border-radius: 12px; border: 1px solid #e5e7eb; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
            </style>
          </head>
          <body>
            <div class="card">
              <h1>Política de Privacidad de KetoTrack</h1>
              <p><strong>KetoTrack</strong> se integra con <strong>Google Health Connect</strong> para leer datos de actividad física de tu reloj <strong>Garmin</strong>.</p>
              <h3>Uso de Datos de Salud</h3>
              <ul>
                <li><strong>Local y Privado:</strong> Tus métricas de Garmin se leen y procesan de forma local en tu teléfono para calcular el vaciado de glucógeno y estado de cetosis.</li>
                <li><strong>Cero Rastreo:</strong> No compartimos tus datos con terceros ni servidores externos.</li>
              </ul>
            </div>
          </body>
          </html>
          EOF

      - name: Actualizar Frontend KetoTrack (Dashboard, Fuego, IA, Garmin y Peso)
        run: |
          if [ -d "keto-tracker" ]; then
            cd keto-tracker
          fi

          # 1. Escribir public/index.html
          cat << 'EOF' > public/index.html
          <!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
            <title>KetoTrack + Garmin</title>
            <link rel="stylesheet" href="styles.css">
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
          </head>
          <body>
            <div class="app-container">
              <!-- Header con Luz Verde y Acceso a Bases Científicas -->
              <header class="app-header">
                <div class="brand">
                  <div class="logo-icon-svg" title="KetoTrack Metabolic Engine">
                    <svg viewBox="0 0 24 24" width="28" height="28" fill="none">
                      <circle cx="12" cy="12" r="10" stroke="#10b981" stroke-width="2" fill="rgba(16, 185, 129, 0.15)"/>
                      <path d="M12 6c-2.4 2.8-3.8 5.6-2 8.4 1.4 2.1 4.2 2.1 5.6 0 1.8-2.8.4-5.6-2-8.4z" fill="#10b981"/>
                      <circle cx="12" cy="13.5" r="1.8" fill="#38bdf8"/>
                    </svg>
                  </div>
                  <div>
                    <h1>KetoTrack</h1>
                    <div class="header-sync-pill" id="headerSyncPill">
                      <span class="pulse-dot"></span>
                      <span id="txtHeaderSync">Garmin Sincronizado</span>
                    </div>
                  </div>
                </div>
                <div class="header-actions">
                  <button id="btnOpenScienceModal" class="btn-icon" title="Bases Científicas y Guías Médicas">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                      <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                      <path d="M9 7h6M9 11h4"/>
                    </svg>
                  </button>
                  <button id="btnSettingsModal" class="btn-icon" title="Configuración y Perfil">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <circle cx="12" cy="12" r="3"/>
                      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                  </button>
                </div>
              </header>



              <!-- PESTAÑA 1: ESTADO (DASHBOARD REDISEÑADO CON FUEGO, CUENTA REGRESIVA Y PASOS DE CETOSIS) -->
              <main id="tab-dashboard" class="tab-pane active">
                <!-- Tarjeta Dinámica de Cetosis (Limpia, Elegante y Enfocada) -->
                <section class="card ketosis-card" id="cardKetosisStatus">
                  <div class="card-header">
                    <span class="badge" id="badgePhase">Día 1: En Proceso</span>
                    <button class="btn-start-process" id="btnOpenStartProcessModal" title="Iniciar o reiniciar protocolo">🚀 Iniciar Proceso</button>
                  </div>

                  <!-- MODO FUEGO: Se activa al llegar al estado de cetosis -->
                  <div id="ketosisFlameBox" class="ketosis-flame-box" style="display: none;">
                    <div class="flame-animation-wrap">
                      <span class="flame-emoji">🔥</span>
                    </div>
                    <div class="flame-info">
                      <div class="flame-badge" id="badgeFlameStage">🔥 CETOSIS NUTRICIONAL ACTIVA</div>
                      <h3 id="txtFlameTitle">Quemando Grasa a Pleno</h3>
                      <p id="txtFlameDesc">Tu cerebro y músculos funcionan con cetonas de alta pureza.</p>
                    </div>
                  </div>

                  <!-- Pronóstico Limpio de Entrada a Cetosis -->
                  <div id="boxKetoForecast" class="clean-forecast-box">
                    <div class="clean-forecast-row">
                      <span class="clean-forecast-icon">⏳</span>
                      <div class="clean-forecast-texts">
                        <span class="clean-forecast-label">Entrada estimada a cetosis (≥ 0.5 mmol/L):</span>
                        <strong class="clean-forecast-time" id="valKetoTargetDate">Calculando pronóstico...</strong>
                      </div>
                    </div>
                  </div>

                  <!-- Velocímetro Metabólico Circular -->
                  <div class="ketosis-gauge-wrap">
                    <div class="gauge-circle" id="gaugeCircle">
                      <div class="gauge-inner">
                        <span class="ketone-val" id="valEstimatedKetones">0.2</span>
                        <span class="ketone-unit">mmol/L est.</span>
                      </div>
                    </div>
                    <div class="gauge-details">
                      <h3 id="txtPhaseTitle">En Proceso de Inducción</h3>
                      <p id="txtPhaseDesc" class="text-muted">Avanzando hacia el umbral de cetosis nutricional.</p>
                    </div>
                  </div>
                </section>

                <!-- Resumen Diario de Macronutrientes y Balance Calórico (100% Ajustado al Ancho) -->
                <section class="card macros-card">
                  <div class="section-title">
                    <div>
                      <h2>Macronutrientes</h2>
                      <span class="sub-personal" id="txtMacroPersonalized">Ajustados a tu meta</span>
                    </div>
                    <span class="carb-status" id="badgeCalorieDeficit">Déficit activo</span>
                  </div>

                  <!-- BALANCE CALÓRICO HERO - NUNCA SE DESBORDA -->
                  <div class="cal-balance-summary">
                    <div class="cal-sum-item">
                      <span class="cal-sum-lbl">Consumidas</span>
                      <span class="cal-sum-val" id="valCalIn">0 <small>kcal</small></span>
                    </div>
                    <div class="cal-sum-divider">/</div>
                    <div class="cal-sum-item">
                      <span class="cal-sum-lbl">Meta Diaria</span>
                      <span class="cal-sum-val" id="valCalTarget">1,800 <small>kcal</small></span>
                    </div>
                    <div class="cal-sum-pill" id="cardCalNet">
                      <span class="cal-sum-lbl" id="lblCalNet">Restantes</span>
                      <strong id="valCalRemaining">1,800 kcal</strong>
                    </div>
                  </div>

                  <!-- TERMÓMETRO MINIMALISTA -->
                  <div class="thermometer-minimal-wrap">
                    <div class="thermometer-minimal-header">
                      <span class="thermometer-label">🌡️ Progreso Calórico</span>
                      <span class="thermometer-percent" id="valThermometerPercent">0%</span>
                    </div>
                    <div class="thermometer-minimal-track">
                      <div class="thermometer-minimal-fill optimal" id="barThermometerFill" style="width: 0%;"></div>
                    </div>
                    <div class="thermometer-minimal-header" style="margin-top: 3px;">
                      <span class="cal-burn-badge" id="lblGarminBurned">⌚ Garmin: 0 kcal quemadas hoy</span>
                      <span class="feedback-badge badge-optimal" id="badgeCalFeedback">✅ En Rango</span>
                    </div>
                  </div>

                  <!-- BARRAS DE MACRONUTRIENTES -->
                  <div class="macro-bars">
                    <!-- Carbohidratos Netos -->
                    <div class="macro-item">
                      <div class="macro-label">
                        <span class="macro-name">Carbos Netos</span>
                        <span class="macro-amount"><strong id="valNetCarbs">0</strong> / <span id="targetNetCarbs">25</span>g</span>
                      </div>
                      <div class="progress-bar-bg">
                        <div class="progress-bar-fill carb-fill" id="barNetCarbs" style="width: 0%"></div>
                      </div>
                    </div>

                    <!-- Grasas -->
                    <div class="macro-item">
                      <div class="macro-label">
                        <span class="macro-name">Grasas</span>
                        <span class="macro-amount"><strong id="valFat">0</strong> / <span id="targetFat">140</span>g</span>
                      </div>
                      <div class="progress-bar-bg">
                        <div class="progress-bar-fill fat-fill" id="barFat" style="width: 0%"></div>
                      </div>
                    </div>

                    <!-- Proteínas -->
                    <div class="macro-item">
                      <div class="macro-label">
                        <span class="macro-name">Proteínas</span>
                        <span class="macro-amount"><strong id="valProtein">0</strong> / <span id="targetProtein">90</span>g</span>
                      </div>
                      <div class="progress-bar-bg">
                        <div class="progress-bar-fill protein-fill" id="barProtein" style="width: 0%"></div>
                      </div>
                    </div>
                  </div>

                  <!-- Distribución Calórica Cetogénica -->
                  <div class="calorie-ratio-row">
                    <div class="ratio-box fat-box">
                      <span class="ratio-num" id="ratioFat">0%</span>
                      <span class="ratio-title">Grasas</span>
                      <small class="ratio-ideal">Meta: 70-75%</small>
                    </div>
                    <div class="ratio-box protein-box">
                      <span class="ratio-num" id="ratioProtein">0%</span>
                      <span class="ratio-title">Proteínas</span>
                      <small class="ratio-ideal">Meta: 20-25%</small>
                    </div>
                    <div class="ratio-box carb-box">
                      <span class="ratio-num" id="ratioCarbs">0%</span>
                      <span class="ratio-title">Carbos</span>
                      <small class="ratio-ideal">Meta: 5-10%</small>
                    </div>
                  </div>
                </section>

                <!-- Botones de Acción Rápida -->
                <section class="quick-action-strip">
                  <button class="btn btn-primary btn-full" id="btnOpenAddMeal">
                    <span>➕</span> Registrar Comida con IA
                  </button>
                </section>
              </main>

                  <!-- PESTAÑA 2: COMIDAS (CON CÁLCULO IA Y LISTA DETALLADA CON FECHA/HORA/BORRADO) -->
              <main id="tab-meals" class="tab-pane">
                <div class="card">
                  <div class="section-title">
                    <h2>Nueva Ingesta</h2>
                    <span class="badge badge-ai">✨ IA Asistida</span>
                  </div>

                  <!-- Formulario con Asistente IA -->
                  <form id="formMeal" class="form-grid">
                    <div class="form-group full-width">
                      <label for="inputMealName">¿Qué comiste? (Escríbelo y presiona el botón IA)</label>
                      <div class="input-with-action">
                        <input type="text" id="inputMealName" placeholder="Ej. Bife de chorizo 300g con 2 huevos fritos y ensalada" required>
                        <button type="button" id="btnAiCalc" class="btn btn-ai-calc" title="Calcular automáticamente nutrientes y calorías con IA">
                          <span>✨</span> Calcular con IA
                        </button>
                      </div>
                      <div id="aiCalcFeedback" class="ai-feedback-banner" style="display: none;"></div>
                    </div>

                    <div class="form-group">
                      <label for="inputCarbs">Carbos Totales (g)</label>
                      <input type="number" step="0.1" id="inputCarbs" value="0">
                    </div>

                    <div class="form-group">
                      <label for="inputFiber">Fibra (g)</label>
                      <input type="number" step="0.1" id="inputFiber" value="0">
                    </div>

                    <div class="form-group">
                      <label for="inputProtein">Proteínas (g)</label>
                      <input type="number" step="0.1" id="inputProtein" value="0">
                    </div>

                    <div class="form-group">
                      <label for="inputFat">Grasas (g)</label>
                      <input type="number" step="0.1" id="inputFat" value="0">
                    </div>

                    <div class="form-group full-width">
                      <label for="inputCalories">Calorías Totales (kcal - autocalculado)</label>
                      <input type="number" id="inputCalories" placeholder="Autocalcular si queda vacío">
                    </div>

                    <button type="submit" class="btn btn-primary full-width">Guardar Comida</button>
                  </form>
                </div>

                <!-- Historial de Comidas Registradas con Fecha, Hora y Borrado -->
                <section class="card meals-list-card">
                  <div class="section-title">
                    <h2>Comidas Registradas Hoy</h2>
                  </div>
                  <div id="mealsList" class="meals-list">
                    <p class="text-muted text-center">No hay comidas registradas hoy.</p>
                  </div>
                </section>
              </main>

              <!-- PESTAÑA 3: GARMIN (100% LIMPIA, AUTOMATIZADA Y SIN SIMULACIÓN) -->
              <main id="tab-garmin" class="tab-pane">
                <div class="card garmin-clean-card">
                  <div class="section-title">
                    <div class="garmin-title-box">
                      <h2>Sincronización Garmin</h2>
                      <span class="badge badge-green" id="garminSourceBadge">Conectado ✓</span>
                    </div>
                    <span class="garmin-live-dot" title="Sincronización automática activa"></span>
                  </div>

                  <!-- Banner de Conexión Automática -->
                  <div class="garmin-auto-banner">
                    <div class="auto-banner-left">
                      <span class="sync-icon-pulsing">🟢</span>
                      <div>
                        <strong>Google Health Connect</strong>
                        <div class="small text-muted" id="garminLastSyncTime">Sincronizado en tiempo real</div>
                      </div>
                    </div>
                    <button id="btnConnectHealthConnect" class="btn btn-sm btn-outline">
                      🔄 Sincronizar Ahora
                    </button>
                  </div>

                  <div id="healthConnectStatusText" class="small text-muted" style="margin: 8px 0 16px 0; text-align: center;">
                    Leyendo pasos, calorías activas y ritmo cardíaco directamente de tu reloj Garmin.
                  </div>

                  <!-- Métricas Reales en Tiempo Real -->
                  <div class="garmin-stats-grid">
                    <div class="stat-card">
                      <span class="stat-icon icon-flame">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                          <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>
                        </svg>
                      </span>
                      <div class="stat-info">
                        <span class="stat-value" id="garminActiveCal">0</span>
                        <span class="stat-label">Calorías Activas</span>
                      </div>
                    </div>

                    <div class="stat-card">
                      <span class="stat-icon icon-steps">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                          <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
                        </svg>
                      </span>
                      <div class="stat-info">
                        <span class="stat-value" id="garminSteps">0</span>
                        <span class="stat-label">Pasos de Hoy</span>
                      </div>
                    </div>

                    <div class="stat-card">
                      <span class="stat-icon icon-heart">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                          <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
                        </svg>
                      </span>
                      <div class="stat-info">
                        <span class="stat-value" id="garminRestingHr">-- bpm</span>
                        <span class="stat-label">Pulsaciones Reposo</span>
                      </div>
                    </div>

                    <div class="stat-card">
                      <span class="stat-icon icon-energy">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                        </svg>
                      </span>
                      <div class="stat-info">
                        <span class="stat-value" id="garminTotalCal">0</span>
                        <span class="stat-label">Gasto Total (kcal)</span>
                      </div>
                    </div>
                  </div>

                  
                  <!-- WIDGET DE PASOS PARA MANTENER LA CETOSIS EN CASO DE EXCESO DE CARBOHIDRATOS -->
                  <div class="steps-garmin-section" id="cardStepsKeto" style="margin: 16px 0;">
                    <div class="section-title">
                      <div>
                        <h3>🎯 Pasos para Mantener la Cetosis</h3>
                        <span class="sub-personal">Pasos necesarios en caso de exceder tu límite de carbohidratos</span>
                      </div>
                      <span class="badge" id="badgeStepStatus">Analizando...</span>
                    </div>

                    <div class="steps-hero-row">
                      <div class="steps-progress-numbers">
                        <div class="step-num-group">
                          <span class="step-big-val" id="valCurrentStepsKeto">0</span>
                          <span class="step-divider" id="stepDividerSlash">/</span>
                          <span class="step-target-val" id="valTargetStepsKeto">0</span>
                          <span class="step-unit" id="stepUnitText">pasos requeridos</span>
                        </div>
                        <div class="step-percent-tag" id="valStepPercent">En Meta</div>
                      </div>

                      <div class="progress-bar-bg" style="height: 10px; margin: 10px 0 8px 0;">
                        <div class="progress-bar-fill" id="barStepProgress" style="width: 100%; background: linear-gradient(90deg, #10b981, #059669);"></div>
                      </div>

                      <div class="steps-feedback-box" id="boxStepsFeedback">
                        <div class="feedback-title" id="txtStepFeedbackTitle">Calculando requerimiento...</div>
                        <div class="feedback-desc" id="txtStepFeedbackDesc">Conectando con tu reloj Garmin...</div>
                      </div>
                    </div>

                    <div class="steps-science-footnote">
                      <span>📐 Modelo ACSM: ~292 pasos por cada gramo neto de carbohidrato excedente para neutralizarlo antes de rellenar el glucógeno.</span>
                    </div>
                  </div>

                  <div class="garmin-privacy-note">
                    🔒 <strong>100% Automático y Privado:</strong> Los datos se leen localmente desde tu reloj Garmin Instinct a través de Android 15. Cero contraseñas y cero servidores intermedios.
                  </div>
                </div>
              </main>

              <!-- PESTAÑA: GRÁFICAS Y ESTADÍSTICAS HISTÓRICAS (CURVAS SUAVIZADAS) -->
              <main id="tab-charts" class="tab-pane">
                <div class="card charts-card">
                  <div class="section-title charts-header-title">
                    <div>
                      <h2>Evolución</h2>
                      <span class="sub-personal" id="txtChartSubtitle">Seguimiento continuo de tu proceso</span>
                    </div>
                    <!-- Toggle 7d / 30d -->
                    <div class="time-range-toggle">
                      <button class="toggle-btn active" id="btnRangeWeek" data-range="week">7 Días</button>
                      <button class="toggle-btn" id="btnRangeMonth" data-range="month">30 Días</button>
                    </div>
                  </div>

                  <!-- Selector de Tipo de Métrica (Segmented Grid que NUNCA desborda) -->
                  <div class="chart-metric-selector">
                    <button class="metric-pill active" data-metric="steps">
                      <svg class="pill-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
                      <span>Actividad</span>
                    </button>
                    <button class="metric-pill" data-metric="macros">
                      <svg class="pill-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 4 13V8a5 5 0 0 1 10 0v5a7 7 0 0 1-3 7z"/></svg>
                      <span>Macros</span>
                    </button>
