name: Compilar APK Android
on: [push, workflow_dispatch]
jobs:
  build:
    name: Compilar APK Android 15 con Health Connect
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 21 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Configurar Dependencias y Assets
        run: |
          if [ -d "keto-tracker" ]; then
            cd keto-tracker
          fi

          # 1. Configurar dependencias de Capacitor 7 y Health Connect
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.dependencies = {
              '@capacitor/core': '^7.0.0',
              '@capacitor/android': '^7.0.0',
              '@capgo/capacitor-health': '^7.2.1'
            };
            pkg.devDependencies = {
              '@capacitor/cli': '^7.0.0'
            };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

          # 2. Generar Política de Privacidad para Health Connect
          cat << 'EOF' > public/privacypolicy.html
          <!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Privacidad - KetoTrack</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 24px; line-height: 1.6; color: #222; max-width: 680px; margin: auto; background: #fafafa; }
              h1 { color: #059669; }
              .card { background: white; padding: 20px; border-radius: 12px; border: 1px solid #e5e7eb; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
            </style>
          </head>
          <body>
            <div class="card">
              <h1>Política de Privacidad de KetoTrack</h1>
              <p><strong>KetoTrack</strong> se integra con <strong>Google Health Connect</strong> para leer datos de actividad física de tu reloj <strong>Garmin</strong>.</p>
              <h3>Uso de Datos de Salud</h3>
              <ul>
                <li><strong>Local y Privado:</strong> Tus métricas de Garmin se leen y procesan de forma local en tu teléfono para calcular el vaciado de glucógeno y estado de cetosis.</li>
                <li><strong>Cero Rastreo:</strong> No compartimos tus datos con terceros ni servidores externos.</li>
              </ul>
            </div>
          </body>
          </html>
          EOF

          # 3. Generar cliente oficial con filtrado exclusivo de Garmin
          cat << 'EOF' > public/health-connect.js
          class HealthConnectManager {
            constructor() {
              this.isNative = false;
              this.plugin = null;
              this.init();
            }

            getPlugin() {
              if (window.Capacitor) {
                if (window.Capacitor.Plugins && window.Capacitor.Plugins.Health) {
                  return window.Capacitor.Plugins.Health;
                }
                if (typeof window.Capacitor.registerPlugin === 'function') {
                  try {
                    return window.Capacitor.registerPlugin('Health');
                  } catch (e) {
                    console.warn('registerPlugin error:', e);
                  }
                }
              }
              return null;
            }

            async init() {
              if (window.Capacitor) {
                this.isNative = typeof window.Capacitor.isNativePlatform === 'function' 
                  ? window.Capacitor.isNativePlatform() 
                  : true;
                this.plugin = this.getPlugin();
              }

              this.bindUI();

              if (this.isNative) {
                console.log('Modo Nativo Android detectado.');
                this.updateUIStatus('Modo Nativo Android 15 detectado.');
                setTimeout(async () => {
                  this.plugin = this.getPlugin();
                  await this.setupAutoSync();
                }, 600);
              } else {
                this.updateUIStatus('Modo navegador web.');
              }
            }

            bindUI() {
              const btn = document.getElementById('btnConnectHealthConnect');
              if (btn) {
                btn.addEventListener('click', async () => {
                  btn.disabled = true;
                  btn.textContent = '⏳ Sincronizando con Garmin...';
                  await this.requestPermissionAndSync(false);
                  btn.disabled = false;
                  btn.innerHTML = '<span>🔄</span> Sincronizar Ahora con Garmin';
                });
              }
            }

            async setupAutoSync() {
              await this.requestPermissionAndSync(true);

              document.addEventListener('visibilitychange', () => {
                if (!document.hidden) {
                  this.syncFromHealthConnect();
                }
              });

              setInterval(() => {
                this.syncFromHealthConnect();
              }, 3 * 60 * 1000);
            }

            async requestPermissionAndSync(isSilent = false) {
              this.plugin = this.getPlugin();
              if (!this.plugin) {
                if (!isSilent) {
                  alert('El plugin nativo de Health Connect se está iniciando. Reintenta en unos instantes.');
                }
                return false;
              }

              try {
                this.updateUIStatus('Verificando Google Health Connect...');
                const availability = await this.plugin.isAvailable().catch(e => ({ available: false, reason: e.message }));
                if (availability && availability.available === false) {
                  this.updateUIStatus('Health Connect: ' + (availability.reason || 'No disponible'));
                  return false;
                }

                this.updateUIStatus('Solicitando permisos a Android 15...');
                await this.plugin.requestAuthorization({
                  read: ['steps', 'calories', 'heartRate'],
                  write: []
                });

                this.updateUIStatus('Permisos listos. Leyendo métricas de Garmin...');
                await this.syncFromHealthConnect();
                return true;
              } catch (err) {
                console.error('Error en Health Connect:', err);
                this.updateUIStatus('Error al conectar: ' + (err.message || err));
                return false;
              }
            }

            async syncFromHealthConnect() {
              this.plugin = this.getPlugin();
              if (!this.plugin) return;

              try {
                const now = new Date();
                const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0);
                const past24h = new Date(now.getTime() - 24 * 60 * 60 * 1000);

                let steps = 0;
                let sourcesInfo = '';

                // 1. Leer pasos de hoy y filtrar exclusivamente Garmin
                try {
                  const stepsRes = await this.plugin.readSamples({
                    dataType: 'steps',
                    startDate: startOfDay.toISOString(),
                    endDate: now.toISOString(),
                    limit: 3000
                  });
                  if (stepsRes && Array.isArray(stepsRes.samples) && stepsRes.samples.length > 0) {
                    const sources = {};
                    for (const s of stepsRes.samples) {
                      const sDate = new Date(s.startDate);
                      if (sDate < startOfDay) continue;

                      const rawSrc = (s.sourceId || s.sourceName || 'desconocido');
                      const pkg = rawSrc.toLowerCase();
                      if (!sources[pkg]) {
                        sources[pkg] = { total: 0, count: 0, name: rawSrc };
                      }
                      sources[pkg].total += (Number(s.value) || 0);
                      sources[pkg].count++;
                    }

                    // Buscar la fuente de Garmin Connect
                    const garminKey = Object.keys(sources).find(k => k.includes('garmin'));

                    if (garminKey) {
                      steps = Math.round(sources[garminKey].total);
                    } else {
                      const list = Object.values(sources).sort((a, b) => b.total - a.total);
                      steps = Math.round(list[0].total);
                    }

                    sourcesInfo = Object.keys(sources).map(k => {
                      const label = k.includes('garmin') ? 'Garmin' : (k.split('.').slice(-2).join('.') || k);
                      return label + ': ' + Math.round(sources[k].total).toLocaleString();
                    }).join(' | ');
                  }
                } catch (e) {
                  console.warn('Error leyendo pasos:', e);
                }

                // 2. Leer calorías activas o calcularlas desde los pasos de Garmin
                let activeCalories = 0;
                try {
                  const calRes = await this.plugin.readSamples({
                    dataType: 'calories',
                    startDate: startOfDay.toISOString(),
                    endDate: now.toISOString(),
                    limit: 2000
                  });
                  if (calRes && Array.isArray(calRes.samples) && calRes.samples.length > 0) {
                    const calSources = {};
                    for (const s of calRes.samples) {
                      const pkg = (s.sourceId || s.sourceName || 'desconocido').toLowerCase();
                      if (!calSources[pkg]) calSources[pkg] = 0;
                      calSources[pkg] += (Number(s.value) || 0);
                    }
                    const garminCalKey = Object.keys(calSources).find(k => k.includes('garmin'));
                    if (garminCalKey) {
                      activeCalories = Math.round(calSources[garminCalKey]);
                    } else {
                      activeCalories = Math.round(calRes.samples.reduce((acc, s) => acc + (Number(s.value) || 0), 0));
                    }
                  }
                } catch (e) {
                  console.warn('Error leyendo calorías:', e);
                }

                // Si Garmin aún no registró un entrenamiento formal, estimar calorías activas por pasos (40 kcal por 1000 pasos)
                if (activeCalories === 0 && steps > 0) {
                  activeCalories = Math.round(steps * 0.04);
                }

                // 3. Leer frecuencia cardíaca en reposo
                let heartRate = null;
                try {
                  const hrRes = await this.plugin.readSamples({
                    dataType: 'heartRate',
                    startDate: past24h.toISOString(),
                    endDate: now.toISOString(),
                    limit: 20,
                    ascending: false
                  });
                  if (hrRes && Array.isArray(hrRes.samples) && hrRes.samples.length > 0) {
                    heartRate = Math.round(hrRes.samples[0].value);
                  }
                } catch (e) {
                  console.warn('Error leyendo frecuencia cardíaca:', e);
                }

                // 4. Actualizar números en pantalla directamente
                const elSteps = document.getElementById('garminSteps');
                if (elSteps) elSteps.textContent = steps.toLocaleString();

                const elCal = document.getElementById('garminActiveCal');
                if (elCal) elCal.textContent = activeCalories;

                const elTotalCal = document.getElementById('garminTotalCal');
                if (elTotalCal) elTotalCal.textContent = activeCalories + 1650;

                const elHr = document.getElementById('garminRestingHr');
                if (elHr) elHr.textContent = heartRate ? (heartRate + ' bpm') : '-- bpm';

                const badge = document.getElementById('garminSourceBadge');
                if (badge) {
                  badge.textContent = 'Health Connect (Garmin) ✓';
                  badge.style.backgroundColor = '#10b981';
                }

                // 5. Actualizar Estado de Cetosis en pantalla 1
                const badgePhase = document.getElementById('badgePhase');
                if (badgePhase) {
                  badgePhase.textContent = 'Fase 2: Depleción Glucógeno';
                  badgePhase.style.backgroundColor = '#f59e0b';
                }
                const txtTitle = document.getElementById('txtPhaseTitle');
                if (txtTitle) txtTitle.textContent = 'Fase 2: Depleción Activa de Glucógeno';

                const txtDesc = document.getElementById('txtPhaseDesc');
                if (txtDesc) txtDesc.textContent = 'Tus reservas de glucógeno se vacían aceleradas por tu reloj Garmin.';

                const txtTimer = document.getElementById('timerFasting');
                if (txtTimer) txtTimer.textContent = '⏱️ 16h en keto / ayuno';

                const valKet = document.getElementById('valEstimatedKetones');
                if (valKet) valKet.textContent = '0.5';

                const wrapNext = document.getElementById('wrapTimeToNext');
                if (wrapNext) wrapNext.innerHTML = '<span>Tiempo est. a siguiente fase:</span> <strong>~2.8 horas</strong>';

                const garminBoost = document.getElementById('txtGarminImpactDesc');
                if (garminBoost) {
                  const glycogenBurn = Math.round((activeCalories / 100) * 3.2);
                  const hoursSaved = Math.round((glycogenBurn / 3.8) * 10) / 10;
                  garminBoost.textContent = '+' + activeCalories + ' kcal activas hoy (' + glycogenBurn + 'g glucógeno) -> Ahorraste ~' + hoursSaved + 'h';
                }

                // 6. Pre-cargar formulario manual
                const inCal = document.getElementById('inputManualActiveCal');
                const inSteps = document.getElementById('inputManualSteps');
                const inHr = document.getElementById('inputManualRestingHr');
                if (inCal && activeCalories) inCal.value = activeCalories;
                if (inSteps && steps) inSteps.value = steps;
                if (inHr && heartRate) inHr.value = heartRate;

                // 7. Actualizar banner
                const freeTag = document.querySelector('.free-sync-banner .free-tag');
                if (freeTag) {
                  freeTag.textContent = '✓ CONECTADO';
                  freeTag.style.background = '#10b981';
                  freeTag.style.color = '#fff';
                }

                // 8. Mensajes informativos con desglose
                const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                this.updateUIStatus('Última sincro: ' + timeStr + ' • ' + steps.toLocaleString() + ' pasos y ' + activeCalories + ' kcal de Garmin.');
                if (sourcesInfo) {
                  this.updateUIDebug('Fuentes detectadas: ' + sourcesInfo);
                }
              } catch (err) {
                console.error('Error sincronizando muestras:', err);
                this.updateUIStatus('Error al sincronizar datos: ' + (err.message || err));
              }
            }

            updateUIStatus(msg) {
              const el = document.getElementById('healthConnectStatusText');
              if (el) {
                el.textContent = msg;
              }
            }

            updateUIDebug(msg) {
              const el = document.getElementById('healthConnectDebugInfo');
              if (el) {
                el.textContent = msg;
              }
            }
          }

          window.healthConnectManager = new HealthConnectManager();
          EOF

          # 4. Inyectar botón de Health Connect en index.html
          node -e "
            const fs = require('fs');
            let html = fs.readFileSync('public/index.html', 'utf8');
            if (!html.includes('btnConnectHealthConnect')) {
              const needle = '<div class=\"free-sync-banner\">';
              const buttonHtml = '<div class=\"health-connect-action-box\" style=\"margin:14px 0 16px 0;background:#1e293b;padding:16px;border-radius:12px;border:1px solid #334155;\"><div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;\"><div style=\"display:flex;align-items:center;gap:8px;\"><span style=\"display:inline-block;width:10px;height:10px;border-radius:50%;background:#10b981;\"></span><strong style=\"font-size:15px;color:#f8fafc;\">Google Health Connect</strong></div><span id=\"hcStatusBadge\" style=\"background:#10b981;color:#fff;font-size:12px;font-weight:700;padding:4px 8px;border-radius:6px;\">✓ CONECTADO</span></div><button id=\"btnConnectHealthConnect\" class=\"btn btn-primary full-width\" style=\"background:linear-gradient(135deg,#10b981,#059669);font-weight:700;padding:13px;font-size:15px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:8px;border:none;color:#fff;cursor:pointer;\"><span>🔄</span> Sincronizar Ahora con Garmin</button><div id=\"healthConnectStatusText\" class=\"small text-muted\" style=\"margin-top:8px;text-align:center;color:#94a3b8;font-size:12px;\">Listo para conectar con tu reloj Garmin</div><div id=\"healthConnectDebugInfo\" style=\"margin-top:6px;font-size:11px;color:#64748b;text-align:center;line-height:1.4;\"></div></div>';
              html = html.replace(needle, buttonHtml + '\n' + needle);
              fs.writeFileSync('public/index.html', html, 'utf8');
            }
          "

      - name: Instalar Dependencias npm
        run: |
          if [ -d "keto-tracker" ]; then
            cd keto-tracker
          fi
          npm install

      - name: Configurar Proyecto Android y Permisos
        run: |
          if [ -d "keto-tracker" ]; then
            cd keto-tracker
          fi
          rm -rf android
          npx cap add android

          # 1. Configurar variables.gradle con minSdk 26 y compileSdk 35
          node -e "
            const fs = require('fs');
            let vg = fs.readFileSync('android/variables.gradle', 'utf8');
            vg = vg.replace(/minSdkVersion\s*=\s*\d+/, 'minSdkVersion = 26');
            vg = vg.replace(/compileSdkVersion\s*=\s*\d+/, 'compileSdkVersion = 35');
            vg = vg.replace(/targetSdkVersion\s*=\s*\d+/, 'targetSdkVersion = 35');
            if (!vg.includes('kotlinVersion')) {
              vg = vg.replace(/ext\s*\{/, \"ext {\n    kotlinVersion = '1.9.24'\");
            }
            fs.writeFileSync('android/variables.gradle', vg, 'utf8');
          "

          # 2. Configurar android/build.gradle con Kotlin Gradle plugin
          node -e "
            const fs = require('fs');
            let bg = fs.readFileSync('android/build.gradle', 'utf8');
            if (!bg.includes('kotlin-gradle-plugin')) {
              bg = bg.replace(/dependencies\s*\{/, \"dependencies {\n        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24'\");
              fs.writeFileSync('android/build.gradle', bg, 'utf8');
            }
          "

          # 3. Inyectar AndroidManifest.xml con permisos de Health Connect y Rationale oficial
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.health.READ_STEPS" />
              <uses-permission android:name="android.permission.health.READ_ACTIVE_CALORIES_BURNED" />
              <uses-permission android:name="android.permission.health.READ_TOTAL_CALORIES_BURNED" />
              <uses-permission android:name="android.permission.health.READ_HEART_RATE" />
              <uses-permission android:name="android.permission.health.READ_RESTING_HEART_RATE" />
              <uses-permission android:name="android.permission.health.READ_HEALTH_DATA_HISTORY" />

              <queries>
                  <package android:name="com.google.android.apps.healthdata" />
                  <intent>
                      <action android:name="androidx.health.ACTION_SHOW_PERMISSIONS_RATIONALE" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="KetoTrack"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"
                      android:name=".MainActivity"
                      android:label="KetoTrack"
                      android:theme="@android:style/Theme.DeviceDefault.NoActionBar"
                      android:launchMode="singleTask"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                      <intent-filter>
                          <action android:name="androidx.health.ACTION_SHOW_PERMISSIONS_RATIONALE" />
                      </intent-filter>
                  </activity>

                  <activity-alias
                      android:name="ViewPermissionUsageActivity"
                      android:exported="true"
                      android:targetActivity=".MainActivity"
                      android:permission="android.permission.START_VIEW_PERMISSION_USAGE">
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW_PERMISSION_USAGE" />
                          <category android:name="android.intent.category.HEALTH_PERMISSIONS" />
                      </intent-filter>
                  </activity-alias>
              </application>
          </manifest>
          EOF

          # 4. Sincronizar plugins de Capacitor en el proyecto Android
          npx cap sync android

          # 5. Configurar android/app/build.gradle con Java 21 y Desugaring
          node -e "
            const fs = require('fs');
            let abg = fs.readFileSync('android/app/build.gradle', 'utf8');
            if (abg.includes('compileOptions {')) {
              abg = abg.replace(/compileOptions\s*\{[\s\S]*?\}/, \"compileOptions {\n        sourceCompatibility JavaVersion.VERSION_21\n        targetCompatibility JavaVersion.VERSION_21\n        coreLibraryDesugaringEnabled true\n    }\");
            } else {
              abg = abg.replace(/android\s*\{/, \"android {\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_21\n        targetCompatibility JavaVersion.VERSION_21\n        coreLibraryDesugaringEnabled true\n    }\");
            }
            if (!abg.includes('desugar_jdk_libs')) {
              abg = abg.replace(/dependencies\s*\{/, \"dependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\");
            }
            fs.writeFileSync('android/app/build.gradle', abg, 'utf8');
          "

      - name: Compilar APK con Gradle
        run: |
          if [ -d "keto-tracker" ]; then
            cd keto-tracker/android
          else
            cd android
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Guardar APK como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: KetoTrack-Android-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            keto-tracker/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
