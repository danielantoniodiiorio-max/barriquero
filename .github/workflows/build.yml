cameraInput?.addEventListener('change', async (e) => {
  const file = e.target.files?.[0];
  if (!file) return;

  // Show preview immediately
  const reader = new FileReader();
  reader.onload = async (event) => {
    const rawDataUrl = event.target.result;
    
    // Resize image on canvas to optimize payload size (< 500KB)
    const optimizedBase64 = await resizeImage(rawDataUrl, 1000, 1000, 0.82);
    
    imgMealPreview.src = optimizedBase64;
    photoPreviewWrap.style.display = 'flex';
    photoAnalysisLoading.style.display = 'flex';
    aiAdviceBanner.style.display = 'none';

    try {
      let a = null;
      try {
        const res = await fetch('/api/meals/analyze-photo', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: optimizedBase64, mimeType: 'image/jpeg' })
        });
        if (res.ok) {
          const data = await res.json();
          if (data.success && data.analysis) a = data.analysis;
        }
      } catch (err) {}

      // Si no hay servidor local, intentar con Gemini API directa si el usuario ingresó su API Key en Ajustes
      if (!a) {
        const savedSettings = JSON.parse(localStorage.getItem('ketotrack_settings') || '{}');
        const apiKey = savedSettings.gemini_api_key || state.settings?.gemini_api_key;
        if (apiKey) {
          try {
            const cleanBase64 = optimizedBase64.replace(/^data:image\/\w+;base64,/, '');
            const geminiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
            const prompt = `Analiza este plato de comida para dieta cetogénica (keto). Devuelve ÚNICAMENTE un JSON válido con este formato: {"name": "Nombre del plato", "carbs": número_carbos_totales, "fiber": número_fibra, "net_carbs": número_netos, "protein": número_proteína, "fat": número_grasa, "calories": número_calorías, "is_keto": true/false, "advice": "breve consejo keto de 1 frase"}`;
            const gRes = await fetch(geminiUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{
                  parts: [
                    { text: prompt },
                    { inlineData: { mimeType: 'image/jpeg', data: cleanBase64 } }
                  ]
                }]
              })
            });
            const gData = await gRes.json();
            const textResponse = gData.candidates?.[0]?.content?.parts?.[0]?.text;
            if (textResponse) {
              const jsonMatch = textResponse.match(/\{[\s\S]*\}/);
              if (jsonMatch) a = JSON.parse(jsonMatch[0]);
            }
          } catch (gErr) {
            console.warn('Error en llamada directa a Gemini:', gErr);
          }
        }
      }

      if (a) {
        // Populate form
        const nameInput = document.getElementById('inputMealName');
        const carbsInput = document.getElementById('inputCarbs');
        const fiberInput = document.getElementById('inputFiber');
        const proteinInput = document.getElementById('inputProtein');
        const fatInput = document.getElementById('inputFat');
        const calInput = document.getElementById('inputCalories');

        nameInput.value = a.name || 'Comida detectada';
        carbsInput.value = a.carbs !== undefined ? a.carbs : 0;
        fiberInput.value = a.fiber !== undefined ? a.fiber : 0;
        proteinInput.value = a.protein !== undefined ? a.protein : 0;
        fatInput.value = a.fat !== undefined ? a.fat : 0;
        calInput.value = a.calories !== undefined ? a.calories : Math.round((a.fat * 9) + (a.protein * 4) + (a.net_carbs * 4));

        [nameInput, carbsInput, fiberInput, proteinInput, fatInput, calInput].forEach(inp => {
          inp.classList.remove('input-highlight');
          void inp.offsetWidth;
          inp.classList.add('input-highlight');
        });

        const ketoBadge = a.is_keto ? '✅ Compatible Keto' : '⚠️ Atención: Carbohidratos altos';
        aiAdviceBanner.innerHTML = `
          <strong>${ketoBadge}</strong>: ${escapeHtml(a.advice || 'Nutrientes calculados con éxito.')}
          <br><small class="text-muted">Revisa y ajusta los valores si es necesario, luego pulsa <strong>Guardar Comida</strong>.</small>
        `;
        aiAdviceBanner.style.display = 'block';
      } else {
        aiAdviceBanner.innerHTML = `
          <strong>📸 Foto capturada</strong>: Completa el nombre y nutrientes abajo (o usa los botones rápidos) y pulsa <strong>Guardar Comida</strong>.
          <br><small class="text-muted">Tip: Para autocompletar con IA, puedes ingresar tu clave gratuita de Gemini en Ajustes (⚙️).</small>
        `;
        aiAdviceBanner.style.display = 'block';
      }
    } catch (err) {
      aiAdviceBanner.innerHTML = `
        <strong>📸 Foto lista</strong>: Completa los valores abajo y pulsa <strong>Guardar Comida</strong>.
      `;
      aiAdviceBanner.style.display = 'block';
    } finally {
      photoAnalysisLoading.style.display = 'none';
      cameraInput.value = '';
    }
  };
  reader.readAsDataURL(file);
});

// Helper: Resize and compress image client-side using Canvas
function resizeImage(dataUrl, maxWidth, maxHeight, quality = 0.8) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      let width = img.width;
      let height = img.height;

      if (width > height) {
        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }
      } else {
        if (height > maxHeight) {
          width = Math.round((width * maxHeight) / height);
          height = maxHeight;
        }
      }

      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.src = dataUrl;
  });
}

