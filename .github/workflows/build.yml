              fiber: roundedFiber,
              net_carbs: netCarbs,
              protein: roundedProtein,
              fat: roundedFat,
              calories: roundedCalories,
              detected: detectedItems.join(" + ")
            };
          }

          // Botón de Cálculo IA en el Formulario de Comida
