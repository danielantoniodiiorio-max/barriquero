              <div id="scienceModal" class="modal-backdrop">
                <div class="modal-card modal-science-card">
                  <div class="modal-header">
                    <div>
                      <h2>📚 Bases Científicas y Guías Médicas</h2>
                      <span class="subtext">Estándares Internacionales de Cetosis y Gasto Energético</span>
                    </div>
                    <button id="btnCloseScienceModal" class="btn-close">&times;</button>
                  </div>
                  <div class="modal-body-scroll">
                    <p class="intro-science">
                      Los algoritmos de cálculo metabólico, progresión longitudinal de cetosis, gasto calórico y compensación por pasos de <strong>KetoTrack</strong> están rigurosamente fundamentados en investigaciones clínicas y consensos de los organismos de salud y nutrición líderes mundiales:
                    </p>

                    <!-- 0. Harvard Medical School & George Cahill (Fisiología Longitudinal Día a Día) -->
                    <div class="science-source-box">
                      <div class="source-header">
                        <span class="source-badge badge-harvard">Harvard / Cahill</span>
                        <h3>Curva Temporal de Adaptación a Cetosis (George Cahill, Harvard Medical School)</h3>
                      </div>
                      <p><strong>Fisiología de la Transición Metabólica y Depleción Glucogénica (Annu. Rev. Nutr. 2006):</strong></p>
                      <ul>
                        <li><strong>¿Por qué la cetosis NO inicia el Día 1?:</strong> El cuerpo humano cuenta con una reserva de ~100-120g de glucógeno hepático y hasta 400g muscular. Durante las primeras 24 horas (Día 1), la glucosa sanguínea se mantiene mediante glucogenólisis y los niveles de insulina descienden paulatinamente, impidiendo que la enzima hepática CPT-1 inicie una síntesis masiva de cetonas. Cetonas basales: <strong>0.1 - 0.3 mmol/L</strong>.</li>
                        <li><strong>Día 2 (Cetosis Inicial / Inducción):</strong> El glucógeno hepático residual cae por debajo de 20-30g. La caída del malonil-CoA activa la carnitina palmitoiltransferasa-1, canalizando ácidos grasos a la mitocondria hepática. Cetonas: <strong>0.3 - 0.5 mmol/L</strong>.</li>
                        <li><strong>Día 3 - 4 (Cetosis Intermedia / Umbral Clínico):</strong> Depleción total de glucógeno hepático. La producción de acetoacetato y beta-hidroxibutirato supera el umbral clínico de <strong>0.5 mmol/L</strong> (0.5 a 1.5 mmol/L), activando el modo de quema de grasa y fuego 🔥. El cerebro cubre hasta el 50% de su energía con cetonas.</li>
                        <li><strong>Día 5+ (Cetosis Avanzada / Ceto-Adaptada):</strong> Validado por Phinney & Volek (AJCN). Aumento de transportadores de monocarboxilato (MCT1) y biogénesis mitocondrial muscular, estabilizando niveles entre <strong>1.5 y 3.0 mmol/L</strong>.</li>
                        <li><strong>Acelerador Garmin (ACSM / OMS):</strong> Cada 1,000 pasos aeróbicos queman ~3.4g de glucógeno. Un volumen activo de 15,000 pasos diarios quema ~50g de glucógeno adicional, reduciendo el tiempo de entrada de 72h a solo <strong>28 - 36 horas (final del Día 1 o durante el Día 2)</strong>.</li>
                      </ul>
                    </div>

                    <!-- 1. Organización Mundial de la Salud (OMS) -->
                    <div class="science-source-box">
                      <div class="source-header">
                        <span class="source-badge badge-who">OMS / WHO</span>
                        <h3>Organización Mundial de la Salud (Ginebra, 2020)</h3>
                      </div>
                      <p><strong>Directrices sobre Actividad Física y Comportamiento Sedentario:</strong></p>
                      <ul>
                        <li><strong>Meta Base:</strong> Recomienda entre 150 y 300 minutos semanales de actividad moderada, equivalente en podometría clínica a <strong>8,000 - 10,000 pasos diarios</strong>.</li>
                        <li><strong>Efecto Metabólico:</strong> El volumen de 8,000 pasos promueve la traslocación del transportador GLUT4 sin requerir picos de insulina, manteniendo los depósitos de glucógeno muscular en rango depletado y protegiendo el estado cetogénico.</li>
                      </ul>
                    </div>

                    <!-- 2. American College of Sports Medicine (ACSM) -->
                    <div class="science-source-box">
                      <div class="source-header">
                        <span class="source-badge badge-acsm">ACSM</span>
                        <h3>American College of Sports Medicine (2021)</h3>
                      </div>
                      <p><strong>Cinética de Oxidación de Sustratos en Marcha Aeróbica:</strong></p>
                      <ul>
                        <li><strong>Tasa de Quema:</strong> A ritmo de caminata (4 a 5 km/h), el cociente respiratorio (RER) es de aproximadamente 0.80, donde el <strong>40% de la energía proviene de glucosa/glucógeno</strong> y el 60% de ácidos grasos libres.</li>
                        <li><strong>Fórmula de Compensación Glucogénica:</strong> Con la tasa calibrada de tu Garmin (0.0342 kcal/paso), oxidar 1 gramo de carbohidrato excedente (4 kcal) requiere: <br>
                          <code>Pasos = 4 kcal / (0.0342 kcal/paso * 0.40) ≈ 292 pasos por gramo neto excedente</code>.
                        </li>
                      </ul>
                    </div>

                    <!-- 3. The American Journal of Clinical Nutrition & Virta Health -->
                    <div class="science-source-box">
                      <div class="source-header">
                        <span class="source-badge badge-ajcn">AJCN / Virta</span>
                        <h3>Dres. Stephen Phinney y Jeff Volek (AJCN)</h3>
                      </div>
                      <p><strong>Definición Clínica de Cetosis Nutricional:</strong></p>
                      <ul>
                        <li><strong>Rango Óptimo:</strong> Concentración plasmática de beta-hidroxibutirato (BOHB) entre <strong>0.5 y 3.0 mmol/L</strong>.</li>
                        <li><strong>Umbral Glucídico:</strong> Ingesta diaria de carbohidratos netos &le; 20 - 25 gramos para asegurar la cetogénesis hepática continua.</li>
                        <li><strong>Proteína de Preservación Muscular:</strong> 1.5g a 2.0g por kilogramo de peso corporal de referencia para evitar la gluconeogénesis destructiva.</li>
                      </ul>
                    </div>

                    <!-- 4. FAO / OMS / UNU -->
                    <div class="science-source-box">
                      <div class="source-header">
                        <span class="source-badge badge-fao">FAO / ONU</span>
                        <h3>Requerimientos Energéticos Humanos (FAO/WHO/UNU)</h3>
                      </div>
                      <p><strong>Cálculo de Tasa Metabólica Basal (BMR):</strong></p>
                      <ul>
                        <li>Aplica la ecuación validada de <strong>Mifflin-St Jeor</strong> (avalada por la Academy of Nutrition and Dietetics): <br>
                          <code>Hombres: (10 * peso_kg) + (6.25 * altura_cm) - (5 * edad) + 5</code><br>
                          <code>Mujeres: (10 * peso_kg) + (6.25 * altura_cm) - (5 * edad) - 161</code>
                        </li>
                        <li>El gasto se distribuye minuto a minuto a lo largo del día y se suma al gasto por actividad física leído por tu reloj Garmin.</li>
                      </ul>
                    </div>

                    <!-- 5. American Diabetes Association (ADA) -->
                    <div class="science-source-box">
                      <div class="source-header">
                        <span class="source-badge badge-ada">ADA</span>
                        <h3>American Diabetes Association (Standards of Care, 2023)</h3>
                      </div>
                      <p><strong>Evidencia en Dietas Muy Bajas en Carbohidratos (VLCD):</strong></p>
                      <ul>
                        <li>Consenso clínico que avala la restricción estricta de carbohidratos (&le; 20-50g diarios) como el enfoque nutricional más eficaz para reducir la variabilidad glucémica, vaciar los depósitos hepáticos y estimular la lipólisis celular.</li>
                      </ul>
                    </div>
                  </div>
                </div>
