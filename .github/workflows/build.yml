name: Compilar APK Android
on: [push, workflow_dispatch]
jobs:
  build:
    name: Compilar APK Android 15 con Health Connect
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 21 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Configurar Dependencias y Assets
        run: |
          if [ -d "keto-tracker" ]; then
            cd keto-tracker
          fi

          # 1. Configurar dependencias de Capacitor 7 y Health Connect
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.dependencies = {
              '@capacitor/core': '^7.0.0',
              '@capacitor/android': '^7.0.0',
              '@capgo/capacitor-health': '^7.2.1'
            };
            pkg.devDependencies = {
              '@capacitor/cli': '^7.0.0'
            };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

          # 2. Generar Política de Privacidad para Health Connect
          cat << 'EOF' > public/privacypolicy.html
          <!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Privacidad - KetoTrack</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 24px; line-height: 1.6; color: #222; max-width: 680px; margin: auto; background: #fafafa; }
              h1 { color: #059669; }
              .card { background: white; padding: 20px; border-radius: 12px; border: 1px solid #e5e7eb; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
            </style>
          </head>
          <body>
            <div class="card">
              <h1>Política de Privacidad de KetoTrack</h1>
              <p><strong>KetoTrack</strong> se integra con <strong>Google Health Connect</strong> para leer datos de actividad física de tu reloj <strong>Garmin</strong>.</p>
              <h3>Uso de Datos de Salud</h3>
              <ul>
                <li><strong>Local y Privado:</strong> Tus métricas de Garmin se leen y procesan de forma local en tu teléfono para calcular el vaciado de glucógeno y estado de cetosis.</li>
                <li><strong>Cero Rastreo:</strong> No compartimos tus datos con terceros ni servidores externos.</li>
              </ul>
            </div>
          </body>
          </html>
          EOF

          # 3. Generar cliente oficial con filtrado exclusivo de Garmin
          cat << 'EOF' > public/health-connect.js
          class HealthConnectManager {
            constructor() {
              this.isNative = false;
              this.plugin = null;
              this.init();
            }

            getPlugin() {
              if (window.Capacitor) {
                if (window.Capacitor.Plugins && window.Capacitor.Plugins.Health) {
                  return window.Capacitor.Plugins.Health;
                }
                if (typeof window.Capacitor.registerPlugin === 'function') {
                  try {
                    return window.Capacitor.registerPlugin('Health');
                  } catch (e) {
                    console.warn('registerPlugin error:', e);
                  }
                }
              }
              return null;
            }

            async init() {
              if (window.Capacitor) {
                this.isNative = typeof window.Capacitor.isNativePlatform === 'function' 
                  ? window.Capacitor.isNativePlatform() 
                  : true;
                this.plugin = this.getPlugin();
              }

              this.bindUI();

              if (this.isNative) {
                console.log('Modo Nativo Android detectado.');
                this.updateUIStatus('Modo Nativo Android 15 detectado.');
                setTimeout(async () => {
                  this.plugin = this.getPlugin();
                  await this.setupAutoSync();
                }, 600);
              } else {
                this.updateUIStatus('Modo navegador web.');
              }
            }

            bindUI() {
              const btn = document.getElementById('btnConnectHealthConnect');
              if (btn) {
                btn.addEventListener('click', async () => {
                  btn.disabled = true;
                  btn.textContent = '⏳ Sincronizando con Garmin...';
                  await this.requestPermissionAndSync(false);
                  btn.disabled = false;
                  btn.innerHTML = '<span>🔄</span> Sincronizar Ahora con Garmin';
                });
              }
            }

            async setupAutoSync() {
              await this.requestPermissionAndSync(true);

              document.addEventListener('visibilitychange', () => {
                if (!document.hidden) {
                  this.syncFromHealthConnect();
                }
              });

              setInterval(() => {
                this.syncFromHealthConnect();
              }, 3 * 60 * 1000);
            }

            async requestPermissionAndSync(isSilent = false) {
              this.plugin = this.getPlugin();
              if (!this.plugin) {
                if (!isSilent) {
                  alert('El plugin nativo de Health Connect se está iniciando. Reintenta en unos instantes.');
                }
                return false;
              }

              try {
                this.updateUIStatus('Verificando Google Health Connect...');
                const availability = await this.plugin.isAvailable().catch(e => ({ available: false, reason: e.message }));
                if (availability && availability.available === false) {
                  this.updateUIStatus('Health Connect: ' + (availability.reason || 'No disponible'));
                  return false;
                }

                this.updateUIStatus('Solicitando permisos a Android 15...');
                await this.plugin.requestAuthorization({
                  read: ['steps', 'calories', 'heartRate'],
                  write: []
                });

                this.updateUIStatus('Permisos listos. Leyendo métricas de Garmin...');
                await this.syncFromHealthConnect();
                return true;
              } catch (err) {
                console.error('Error en Health Connect:', err);
                this.updateUIStatus('Error al conectar: ' + (err.message || err));
                return false;
              }
            }

            async syncFromHealthConnect() {
              this.plugin = this.getPlugin();
              if (!this.plugin) return;

              try {
                const now = new Date();
                const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0);
                const past24h = new Date(now.getTime() - 24 * 60 * 60 * 1000);

                let steps = 0;
                let sourcesInfo = '';

                // 1. Leer pasos de hoy y filtrar exclusivamente Garmin
                try {
                  const stepsRes = await this.plugin.readSamples({
                    dataType: 'steps',
                    startDate: startOfDay.toISOString(),
                    endDate: now.toISOString(),
                    limit: 3000
                  });
                  if (stepsRes && Array.isArray(stepsRes.samples) && stepsRes.samples.length > 0) {
                    const sources = {};
                    for (const s of stepsRes.samples) {
                      const sDate = new Date(s.startDate);
                      if (sDate < startOfDay) continue;

                      const rawSrc = (s.sourceId || s.sourceName || 'desconocido');
                      const pkg = rawSrc.toLowerCase();
                      if (!sources[pkg]) {
                        sources[pkg] = { total: 0, count: 0, name: rawSrc };
                      }
                      sources[pkg].total += (Number(s.value) || 0);
                      sources[pkg].count++;
                    }

                    // Buscar la fuente de Garmin Connect
                    const garminKey = Object.keys(sources).find(k => k.includes('garmin'));

                    if (garminKey) {
                      steps = Math.round(sources[garminKey].total);
                    } else {
                      const list = Object.values(sources).sort((a, b) => b.total - a.total);
                      steps = Math.round(list[0].total);
                    }

                    sourcesInfo = Object.keys(sources).map(k => {
                      const label = k.includes('garmin') ? 'Garmin' : (k.split('.').slice(-2).join('.') || k);
                      return label + ': ' + Math.round(sources[k].total).toLocaleString();
                    }).join(' | ');
                  }
                } catch (e) {
                  console.warn('Error leyendo pasos:', e);
                }

                // 2. Leer calorías activas o calcularlas desde los pasos de Garmin
                let activeCalories = 0;
                try {
                  const calRes = await this.plugin.readSamples({
                    dataType: 'calories',
                    startDate: startOfDay.toISOString(),
                    endDate: now.toISOString(),
                    limit: 2000
                  });
                  if (calRes && Array.isArray(calRes.samples) && calRes.samples.length > 0) {
                    const calSources = {};
                    for (const s of calRes.samples) {
                      const pkg = (s.sourceId || s.sourceName || 'desconocido').toLowerCase();
                      if (!calSources[pkg]) calSources[pkg] = 0;
                      calSources[pkg] += (Number(s.value) || 0);
                    }
                    const garminCalKey = Object.keys(calSources).find(k => k.includes('garmin'));
                    if (garminCalKey) {
                      activeCalories = Math.round(calSources[garminCalKey]);
                    } else {
                      activeCalories = Math.round(calRes.samples.reduce((acc, s) => acc + (Number(s.value) || 0), 0));
                    }
                  }
                } catch (e) {
                  console.warn('Error leyendo calorías:', e);
                }

                // Si Garmin aún no registró un entrenamiento formal, estimar calorías activas por pasos calibrado con Garmin Instinct (34.2 kcal cada 1000 pasos)
                if (activeCalories === 0 && steps > 0) {
                  activeCalories = Math.round(steps * 0.0342);
                }

                // 3. Leer frecuencia cardíaca en reposo
                let heartRate = null;
                try {
                  const hrRes = await this.plugin.readSamples({
                    dataType: 'heartRate',
                    startDate: past24h.toISOString(),
                    endDate: now.toISOString(),
                    limit: 20,
                    ascending: false
                  });
                  if (hrRes && Array.isArray(hrRes.samples) && hrRes.samples.length > 0) {
                    heartRate = Math.round(hrRes.samples[0].value);
                  }
                } catch (e) {
                  console.warn('Error leyendo frecuencia cardíaca:', e);
                }

                // 4. Cálculo de Gasto Acumulado en el día (Descanso transcurrido + Activo, idéntico al reloj Garmin)
                const elapsedHours = Math.max(0.1, now.getHours() + (now.getMinutes() / 60));
                const dailyBmr = 2192; // Tasa metabólica de reposo calibrada con tu reloj Garmin Instinct (1052 kcal de descanso a las 11:31)
                const restingSoFar = Math.round((dailyBmr / 24) * elapsedHours);
                const totalSoFar = restingSoFar + activeCalories;

                // 5. Actualizar números en pantalla directamente
                const elSteps = document.getElementById('garminSteps');
                if (elSteps) elSteps.textContent = steps.toLocaleString();

                const elCal = document.getElementById('garminActiveCal');
                if (elCal) elCal.textContent = activeCalories;

                const elTotalCal = document.getElementById('garminTotalCal');
                if (elTotalCal) elTotalCal.textContent = totalSoFar;

                const elHr = document.getElementById('garminRestingHr');
                if (elHr) elHr.textContent = heartRate ? (heartRate + ' bpm') : '-- bpm';

                const badge = document.getElementById('garminSourceBadge');
                if (badge) {
                  badge.textContent = 'Health Connect (Garmin) ✓';
                  badge.style.backgroundColor = '#10b981';
                }

                // 5. Actualizar Estado de Cetosis en pantalla 1
                const badgePhase = document.getElementById('badgePhase');
                if (badgePhase) {
                  badgePhase.textContent = 'Fase 2: Depleción Glucógeno';
                  badgePhase.style.backgroundColor = '#f59e0b';
                }
                const txtTitle = document.getElementById('txtPhaseTitle');
                if (txtTitle) txtTitle.textContent = 'Fase 2: Depleción Activa de Glucógeno';

                const txtDesc = document.getElementById('txtPhaseDesc');
                if (txtDesc) txtDesc.textContent = 'Tus reservas de glucógeno se vacían aceleradas por tu reloj Garmin.';

                const txtTimer = document.getElementById('timerFasting');
                if (txtTimer) txtTimer.textContent = '⏱️ 16h en keto / ayuno';

                const valKet = document.getElementById('valEstimatedKetones');
                if (valKet) valKet.textContent = '0.5';

                const wrapNext = document.getElementById('wrapTimeToNext');
                if (wrapNext) wrapNext.innerHTML = '<span>Tiempo est. a siguiente fase:</span> <strong>~2.8 horas</strong>';

                const garminBoost = document.getElementById('txtGarminImpactDesc');
                if (garminBoost) {
                  const glycogenBurn = Math.round((activeCalories / 100) * 3.2);
                  const hoursSaved = Math.round((glycogenBurn / 3.8) * 10) / 10;
                  garminBoost.textContent = '+' + activeCalories + ' kcal activas hoy (' + glycogenBurn + 'g glucógeno) -> Ahorraste ~' + hoursSaved + 'h';
                }

                // 6. Pre-cargar formulario manual
                const inCal = document.getElementById('inputManualActiveCal');
                const inSteps = document.getElementById('inputManualSteps');
                const inHr = document.getElementById('inputManualRestingHr');
                if (inCal && activeCalories) inCal.value = activeCalories;
                if (inSteps && steps) inSteps.value = steps;
                if (inHr && heartRate) inHr.value = heartRate;

                // 7. Actualizar banner
                const freeTag = document.querySelector('.free-sync-banner .free-tag');
                if (freeTag) {
                  freeTag.textContent = '✓ CONECTADO';
                  freeTag.style.background = '#10b981';
                  freeTag.style.color = '#fff';
                }

                // 8. Mensajes informativos con desglose
                const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                this.updateUIStatus('Última sincro: ' + timeStr + ' • ' + steps.toLocaleString() + ' pasos, ' + activeCalories + ' kcal activas y ' + totalSoFar + ' kcal totales (Desc: ' + restingSoFar + ' + Activo: ' + activeCalories + ').');
                if (sourcesInfo) {
                  this.updateUIDebug('Fuentes detectadas: ' + sourcesInfo);
                }
              } catch (err) {
                console.error('Error sincronizando muestras:', err);
                this.updateUIStatus('Error al sincronizar datos: ' + (err.message || err));
              }
            }

            updateUIStatus(msg) {
              const el = document.getElementById('healthConnectStatusText');
              if (el) {
                el.textContent = msg;
              }
            }

            updateUIDebug(msg) {
              const el = document.getElementById('healthConnectDebugInfo');
              if (el) {
                el.textContent = msg;
              }
            }
          }

          window.healthConnectManager = new HealthConnectManager();
          EOF

          
          # Inyectar app.js actualizado con soporte offline para comidas y recálculo de macros
          cat << 'EOF' > public/app.js
// App State
let state = {
  status: null,
  meals: [],
  ketoneLogs: [],
  settings: {}
};

// DOM Elements
const tabs = document.querySelectorAll('.nav-tab');
const tabPanes = document.querySelectorAll('.tab-pane');

// Navigation Tabs
tabs.forEach(tab => {
  tab.addEventListener('click', () => {
    tabs.forEach(t => t.classList.remove('active'));
    tabPanes.forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    const target = document.getElementById(tab.dataset.tab);
    if (target) target.classList.add('active');
  });
});

document.getElementById('btnOpenAddMeal')?.addEventListener('click', () => {
  document.querySelector('[data-tab="tab-meals"]').click();
});

// Settings Modal
const settingsModal = document.getElementById('settingsModal');
document.getElementById('btnSettingsModal')?.addEventListener('click', () => {
  loadSettings();
  settingsModal.classList.add('show');
});
document.getElementById('btnCloseSettingsModal')?.addEventListener('click', () => {
  settingsModal.classList.remove('show');
});

// Client-side Keto Calculation Engine (allows full offline & mobile functionality)
function calculateDailyMacrosClient(meals, settings) {
  let totalNetCarbs = 0;
  let totalCarbs = 0;
  let totalFiber = 0;
  let totalProtein = 0;
  let totalFat = 0;
  let totalCalories = 0;

  for (const m of (meals || [])) {
    totalCarbs += Number(m.carbs || 0);
    totalFiber += Number(m.fiber || 0);
    totalNetCarbs += Number(m.net_carbs || 0);
    totalProtein += Number(m.protein || 0);
    totalFat += Number(m.fat || 0);
    totalCalories += Number(m.calories || 0);
  }

  const fatCalories = totalFat * 9;
  const proteinCalories = totalProtein * 4;
  const carbCalories = totalNetCarbs * 4;
  const macroCaloriesSum = fatCalories + proteinCalories + carbCalories;

  const fatRatio = macroCaloriesSum > 0 ? Math.round((fatCalories / macroCaloriesSum) * 100) : 0;
  const proteinRatio = macroCaloriesSum > 0 ? Math.round((proteinCalories / macroCaloriesSum) * 100) : 0;
  const carbRatio = macroCaloriesSum > 0 ? Math.round((carbCalories / macroCaloriesSum) * 100) : 0;

  const netCarbTarget = Number(settings?.net_carbs_target || 25);
  const proteinTarget = Number(settings?.protein_target || 90);
  const fatTarget = Number(settings?.fat_target || 140);
  const calorieTarget = Number(settings?.calories_target || 1800);

  const carbLimitExceeded = totalNetCarbs > netCarbTarget;
  const carbRemaining = Math.max(0, netCarbTarget - totalNetCarbs);

  return {
    totals: {
      carbs: Math.round(totalCarbs * 10) / 10,
      fiber: Math.round(totalFiber * 10) / 10,
      netCarbs: Math.round(totalNetCarbs * 10) / 10,
      protein: Math.round(totalProtein * 10) / 10,
      fat: Math.round(totalFat * 10) / 10,
      calories: Math.round(totalCalories)
    },
    ratios: { fat: fatRatio, protein: proteinRatio, carbs: carbRatio },
    targets: { netCarbs: netCarbTarget, protein: proteinTarget, fat: fatTarget, calories: calorieTarget },
    status: {
      carbLimitExceeded,
      carbRemaining: Math.round(carbRemaining * 10) / 10,
      isKetoCompliant: !carbLimitExceeded && (fatRatio >= 60 || totalCalories === 0)
    }
  };
}

function calculateKetosisStateClient(meals, garmin, settings) {
  const now = new Date();
  const netCarbTarget = Number(settings?.net_carbs_target || 25);
  const activeCalories = Number(garmin?.active_calories || 0);

  const sortedMeals = [...(meals || [])].sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
  let lastCarbTimestamp = null;
  let totalNetCarbsLast24h = 0;
  const oneDayAgo = now.getTime() - (24 * 60 * 60 * 1000);

  for (const meal of sortedMeals) {
    const mealTime = new Date(meal.timestamp).getTime();
    if (mealTime >= oneDayAgo) {
      totalNetCarbsLast24h += Number(meal.net_carbs || 0);
    }
    if (Number(meal.net_carbs) >= 8) {
      lastCarbTimestamp = new Date(meal.timestamp);
    }
  }

  let hoursFastingOrKeto = 18;
  if (lastCarbTimestamp) {
    const diffMs = now.getTime() - lastCarbTimestamp.getTime();
    hoursFastingOrKeto = Math.max(0, diffMs / (1000 * 60 * 60));
  } else if (sortedMeals.length > 0) {
    const firstMealTime = new Date(sortedMeals[0].timestamp).getTime();
    hoursFastingOrKeto = Math.max(0, (now.getTime() - firstMealTime) / (1000 * 60 * 60));
  }

  const garminGlycogenBurn = (activeCalories / 100) * 3.2;
  const basalGlycogenBurn = hoursFastingOrKeto * 3.8;
  const netCarbsAdded = Math.min(100, totalNetCarbsLast24h);

  let remainingGlycogen = Math.max(0, Math.min(110, 80 + netCarbsAdded - basalGlycogenBurn - garminGlycogenBurn));
  if (totalNetCarbsLast24h > netCarbTarget * 1.5) {
    remainingGlycogen = Math.min(110, remainingGlycogen + 40);
  }

  let phase = 1;
  let phaseName = 'Fase 1: Digestión / Uso de Glucosa';
  let phaseDesc = 'Niveles de glucógeno elevados. Aún no hay producción significativa de cetonas.';
  let estimatedKetones = 0.2;
  let statusColor = '#ef4444';
  let timeToNextPhase = null;

  const currentBurnRatePerHour = 3.8 + ((activeCalories / 16) / 100) * 3.2;

  if (remainingGlycogen > 60) {
    phase = 1;
    phaseName = 'Fase 1: Digestión / Uso de Glucosa';
    phaseDesc = 'Niveles de glucógeno elevados. Aún no hay producción significativa de cetonas.';
    estimatedKetones = 0.2;
    statusColor = '#ef4444';
    const gramsToDrop = remainingGlycogen - 60;
    timeToNextPhase = Math.round((gramsToDrop / currentBurnRatePerHour) * 10) / 10;
  } else if (remainingGlycogen > 20) {
    phase = 2;
    phaseName = 'Fase 2: Depleción Activa de Glucógeno';
    phaseDesc = 'Tus reservas de glucógeno se vacían con rapidez impulsadas por tu reloj Garmin.';
    estimatedKetones = 0.3 + ((60 - remainingGlycogen) / 40) * 0.2;
    statusColor = '#f59e0b';
    const gramsToDrop = remainingGlycogen - 20;
    timeToNextPhase = Math.round((gramsToDrop / currentBurnRatePerHour) * 10) / 10;
  } else if (remainingGlycogen > 5) {
    phase = 3;
    phaseName = 'Fase 3: Inicio de Cetogénesis';
    phaseDesc = 'Glucógeno casi agotado. Tu hígado produce beta-hidroxibutirato.';
    estimatedKetones = 0.5 + ((20 - remainingGlycogen) / 15) * 0.5;
    statusColor = '#06b6d4';
    const gramsToDrop = remainingGlycogen - 5;
    timeToNextPhase = Math.round((gramsToDrop / currentBurnRatePerHour) * 10) / 10;
  } else {
    phase = 4;
    phaseName = 'Fase 4: Cetosis Nutricional Óptima';
    phaseDesc = '¡En plena cetosis nutricional! Máxima utilización de grasas como combustible.';
    estimatedKetones = 1.0 + Math.min(1.5, (hoursFastingOrKeto - 20) * 0.05);
    statusColor = '#10b981';
    timeToNextPhase = 0;
  }

  const hoursSavedByGarmin = Math.round((garminGlycogenBurn / 3.8) * 10) / 10;

  return {
    phase,
    phaseName,
    phaseDesc,
    estimatedKetones: Math.round(estimatedKetones * 10) / 10,
    glycogenRemainingGrams: Math.round(remainingGlycogen * 10) / 10,
    glycogenPercentage: Math.round((remainingGlycogen / 110) * 100),
    hoursFastingOrKeto: Math.round(hoursFastingOrKeto * 10) / 10,
    timeToNextPhaseHours: timeToNextPhase,
    statusColor,
    garminImpact: {
      activeCalories,
      extraGlycogenBurnGrams: Math.round(garminGlycogenBurn * 10) / 10,
      hoursSaved: hoursSavedByGarmin
    }
  };
}

function recalculateClientState() {
  const savedSettings = JSON.parse(localStorage.getItem('ketotrack_settings') || '{}');
  const savedGarmin = JSON.parse(localStorage.getItem('ketotrack_garmin') || '{"active_calories":0,"steps":0,"resting_hr":60,"source":"health_connect"}');
  const savedMeals = JSON.parse(localStorage.getItem('ketotrack_meals') || '[]');

  state.settings = { ...state.settings, ...savedSettings };
  state.meals = savedMeals;
  const garmin = state.status?.garmin || savedGarmin;

  const macros = calculateDailyMacrosClient(state.meals, state.settings);
  const ketosis = calculateKetosisStateClient(state.meals, garmin, state.settings);

  state.status = {
    macros,
    ketosis,
    garmin
  };

  renderDashboard(state.status);
  renderGarminView(garmin);
}

// Expuesto globalmente para que health-connect.js lo invoque directamente
window.applyGarminMetrics = function(arg1, arg2, arg3, arg4) {
  let steps = 0, activeCalories = 0, restingHr = 60, source = 'Health Connect (Garmin)';
  if (typeof arg1 === 'object' && arg1 !== null) {
    steps = arg1.steps || 0;
    activeCalories = arg1.activeCalories || arg1.active_calories || 0;
    restingHr = arg1.heartRate || arg1.resting_hr || 60;
    source = arg1.source || 'Health Connect (Garmin)';
  } else {
    steps = arg1 || 0;
    activeCalories = arg2 || 0;
    restingHr = arg3 || 60;
    source = arg4 || 'Health Connect (Garmin)';
  }

  const now = new Date();
  const elapsedHours = Math.max(0.1, now.getHours() + (now.getMinutes() / 60));
  const dailyBmr = 2192; // Calibrado con perfil Garmin Instinct (1052 kcal de descanso a las 11:31)
  const restingSoFar = Math.round((dailyBmr / 24) * elapsedHours);
  const numActive = Number(activeCalories) || 0;
  const totalCaloriesSoFar = restingSoFar + numActive;

  const garmin = {
    active_calories: numActive,
    steps: Number(steps) || 0,
    resting_hr: Number(restingHr) || 60,
    bmr_calories: restingSoFar,
    daily_bmr: dailyBmr,
    total_calories: totalCaloriesSoFar,
    projected_calories: dailyBmr + numActive,
    source: source,
    timestamp: now.toISOString()
  };

  if (!state.status) state.status = {};
  state.status.garmin = garmin;
  localStorage.setItem('ketotrack_garmin', JSON.stringify(garmin));
  recalculateClientState();
};

// Load Full Status
async function loadStatus() {
  recalculateClientState();

  try {
    const res = await fetch('/api/status');
    if (res.ok) {
      const data = await res.json();
      state.status = data;
      renderDashboard(data);
      renderGarminView(data.garmin);
    }
  } catch (err) {}
}

// Render Dashboard
function renderDashboard(data) {
  const { ketosis, macros, garmin } = data;

  // Ketosis Gauge & Phase
  document.getElementById('badgePhase').textContent = `Fase ${ketosis.phase}`;
  document.getElementById('badgePhase').style.backgroundColor = ketosis.statusColor;

  document.getElementById('timerFasting').textContent = `⏱️ ${ketosis.hoursFastingOrKeto}h en keto / ayuno`;
  document.getElementById('valEstimatedKetones').textContent = ketosis.estimatedKetones.toFixed(1);
  document.getElementById('txtPhaseTitle').textContent = ketosis.phaseName;
  document.getElementById('txtPhaseDesc').textContent = ketosis.phaseDesc;

  // Gauge gradient circle
  const gaugePercent = Math.min(100, Math.max(10, (ketosis.estimatedKetones / 2.5) * 100));
  const gaugeDeg = Math.round((gaugePercent / 100) * 360);
  const gaugeCircle = document.getElementById('gaugeCircle');
  gaugeCircle.style.background = `conic-gradient(${ketosis.statusColor} 0deg ${gaugeDeg}deg, var(--card-border) ${gaugeDeg}deg 360deg)`;
  gaugeCircle.style.boxShadow = `0 0 16px ${ketosis.statusColor}44`;

  // Time to next phase
  const wrapNext = document.getElementById('wrapTimeToNext');
  if (ketosis.phase >= 4) {
    wrapNext.innerHTML = `<span>Estado:</span> <strong style="color:var(--accent-green)">En Cetosis Óptima</strong>`;
  } else if (ketosis.timeToNextPhaseHours) {
    wrapNext.innerHTML = `<span>Tiempo est. a siguiente fase:</span> <strong>~${ketosis.timeToNextPhaseHours} horas</strong>`;
  }

  // Garmin boost banner
  const impact = ketosis.garminImpact;
  document.getElementById('txtGarminImpactDesc').textContent = 
    `+${impact.activeCalories} kcal activas hoy (${impact.extraGlycogenBurnGrams}g glucógeno quemado) -> ¡Ahorraste ~${impact.hoursSaved}h para entrar en cetosis!`;

  // Macros
  document.getElementById('valNetCarbs').textContent = macros.totals.netCarbs;
  document.getElementById('targetNetCarbs').textContent = macros.targets.netCarbs;
  const carbPct = Math.min(100, (macros.totals.netCarbs / macros.targets.netCarbs) * 100);
  const barNetCarbs = document.getElementById('barNetCarbs');
  barNetCarbs.style.width = `${carbPct}%`;
  
  const badgeCarb = document.getElementById('badgeCarbStatus');
  if (macros.status.carbLimitExceeded) {
    badgeCarb.textContent = '¡Límite Superado!';
    badgeCarb.style.color = 'var(--accent-red)';
    barNetCarbs.style.background = 'var(--accent-red)';
  } else {
    badgeCarb.textContent = `${macros.status.carbRemaining}g restantes`;
    badgeCarb.style.color = 'var(--accent-green)';
    barNetCarbs.style.background = 'var(--accent-amber)';
  }

  document.getElementById('valFat').textContent = macros.totals.fat;
  document.getElementById('targetFat').textContent = macros.targets.fat;
  document.getElementById('barFat').style.width = `${Math.min(100, (macros.totals.fat / macros.targets.fat) * 100)}%`;

  document.getElementById('valProtein').textContent = macros.totals.protein;
  document.getElementById('targetProtein').textContent = macros.targets.protein;
  document.getElementById('barProtein').style.width = `${Math.min(100, (macros.totals.protein / macros.targets.protein) * 100)}%`;

  // Caloric ratios
  document.getElementById('ratioFat').textContent = `${macros.ratios.fat}%`;
  document.getElementById('ratioProtein').textContent = `${macros.ratios.protein}%`;
  document.getElementById('ratioCarbs').textContent = `${macros.ratios.carbs}%`;
}

// Render Garmin View
function renderGarminView(garmin) {
  document.getElementById('garminActiveCal').textContent = garmin.active_calories || 0;
  document.getElementById('garminSteps').textContent = (garmin.steps || 0).toLocaleString();
  document.getElementById('garminRestingHr').textContent = `${garmin.resting_hr || '--'} bpm`;
  document.getElementById('garminTotalCal').textContent = garmin.total_calories || 0;

  const sourceBadge = document.getElementById('garminSourceBadge');
  if (sourceBadge) {
    if (garmin.source && (garmin.source.includes('Health') || garmin.source.includes('health') || garmin.source.includes('Garmin'))) {
      sourceBadge.textContent = 'Health Connect (Garmin) ✓';
      sourceBadge.style.backgroundColor = '#10b981';
    } else if (garmin.source === 'garmin_cloud') {
      sourceBadge.textContent = 'Garmin Cloud ✓';
      sourceBadge.style.backgroundColor = 'var(--accent-green)';
    } else if (garmin.source === 'garmin_manual') {
      sourceBadge.textContent = 'Garmin Real ✓';
      sourceBadge.style.backgroundColor = 'var(--accent-green)';
    } else {
      sourceBadge.textContent = 'Modo Simulado';
      sourceBadge.style.backgroundColor = 'var(--accent-cyan)';
    }
  }

  // Pre-cargar valores en formulario manual si están vacíos
  const inCal = document.getElementById('inputManualActiveCal');
  const inSteps = document.getElementById('inputManualSteps');
  const inHr = document.getElementById('inputManualRestingHr');
  if (inCal && !inCal.value && garmin.active_calories) inCal.value = garmin.active_calories;
  if (inSteps && !inSteps.value && garmin.steps) inSteps.value = garmin.steps;
  if (inHr && !inHr.value && garmin.resting_hr) inHr.value = garmin.resting_hr;
}

// Load & Render Meals
async function loadMeals() {
  const localMeals = JSON.parse(localStorage.getItem('ketotrack_meals') || '[]');
  state.meals = localMeals;
  renderMealsList(state.meals);

  try {
    const res = await fetch('/api/meals');
    if (res.ok) {
      const data = await res.json();
      if (data.meals && Array.isArray(data.meals) && data.meals.length > 0) {
        state.meals = data.meals;
        localStorage.setItem('ketotrack_meals', JSON.stringify(state.meals));
        renderMealsList(state.meals);
      }
    }
  } catch (err) {}
}

function renderMealsList(meals) {
  const container = document.getElementById('mealsList');
  if (!meals || meals.length === 0) {
    container.innerHTML = '<p class="text-muted text-center">No hay comidas registradas hoy.</p>';
    return;
  }

  container.innerHTML = meals.map(m => `
    <div class="meal-item">
      <div>
        <div class="meal-title">${escapeHtml(m.name)}</div>
        <div class="meal-sub">
          <strong>${m.net_carbs}g carbos netos</strong> (${m.carbs}g tot - ${m.fiber}g fib) • 
          ${m.fat}g grasa • ${m.protein}g prot • ${m.calories} kcal
        </div>
      </div>
      <button class="meal-del-btn" onclick="deleteMeal(${m.id})" title="Eliminar">🗑️</button>
    </div>
  `).join('');
}

window.deleteMeal = function(id) {
  if (!confirm('¿Eliminar esta comida?')) return;
  const localMeals = JSON.parse(localStorage.getItem('ketotrack_meals') || '[]');
  state.meals = localMeals.filter(m => String(m.id) !== String(id));
  localStorage.setItem('ketotrack_meals', JSON.stringify(state.meals));
  renderMealsList(state.meals);
  recalculateClientState();

  try {
    fetch('/api/meals/' + id, { method: 'DELETE' }).catch(() => {});
  } catch (err) {}
};

// Meal Form Submission
document.getElementById('formMeal')?.addEventListener('submit', (e) => {
  e.preventDefault();
  const nameInput = document.getElementById('inputMealName');
  const name = nameInput ? nameInput.value.trim() : '';
  if (!name) {
    alert('Por favor ingresa un nombre para el alimento.');
    return;
  }
  const carbs = parseFloat(document.getElementById('inputCarbs').value) || 0;
  const fiber = parseFloat(document.getElementById('inputFiber').value) || 0;
  const protein = parseFloat(document.getElementById('inputProtein').value) || 0;
  const fat = parseFloat(document.getElementById('inputFat').value) || 0;
  let calories = parseFloat(document.getElementById('inputCalories').value);

  const netCarbs = Math.max(0, Math.round((carbs - fiber) * 10) / 10);
  if (isNaN(calories) || calories === 0) {
    calories = Math.round((fat * 9) + (protein * 4) + (netCarbs * 4));
  }

  const newMeal = {
    id: Date.now(),
    name,
    carbs,
    fiber,
    net_carbs: netCarbs,
    protein,
    fat,
    calories,
    timestamp: new Date().toISOString()
  };

  // 1. Guardar de inmediato en almacenamiento local (persistencia nativa en teléfono)
  const localMeals = JSON.parse(localStorage.getItem('ketotrack_meals') || '[]');
  localMeals.unshift(newMeal);
  localStorage.setItem('ketotrack_meals', JSON.stringify(localMeals));
  state.meals = localMeals;

  // 2. Limpiar formulario
  e.target.reset();
  document.getElementById('inputCarbs').value = '0';
  document.getElementById('inputFiber').value = '0';
  document.getElementById('inputProtein').value = '0';
  document.getElementById('inputFat').value = '0';
  document.getElementById('inputCalories').value = '';

  // 3. Renderizar historial y recalcular dashboard inmediatamente
  renderMealsList(state.meals);
  recalculateClientState();

  // 4. Intentar sincronizar con backend si está disponible (no bloqueante)
  try {
    fetch('/api/meals', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, carbs, fiber, protein, fat, calories })
    }).catch(() => {});
  } catch (err) {}

  // 5. Notificar al usuario y volver al dashboard
  alert(`¡Comida "${name}" guardada con éxito!\n• Carbos Netos: ${netCarbs}g\n• Grasas: ${fat}g\n• Proteínas: ${protein}g\n• Calorías: ${calories} kcal`);
  document.querySelector('[data-tab="tab-dashboard"]').click();
});

// AI Vision Camera Capture & Analysis
const btnTriggerCamera = document.getElementById('btnTriggerCamera');
const cameraInput = document.getElementById('cameraInput');
const photoAnalysisLoading = document.getElementById('photoAnalysisLoading');
const photoPreviewWrap = document.getElementById('photoPreviewWrap');
const imgMealPreview = document.getElementById('imgMealPreview');
const aiAdviceBanner = document.getElementById('aiAdviceBanner');

btnTriggerCamera?.addEventListener('click', () => {
