name: Compilar APK Android
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Preparar y Compilar APK
        run: |
          cd keto-tracker
          # 1. Corregir dependencia en package.json
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json')); delete p.dependencies['@capgo/capacitor-health']; fs.writeFileSync('package.json', JSON.stringify(p,null,2));"

          # 2. Respaldar manifiesto con permisos de Health Connect
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          rm -rf android

          # 3. Instalar dependencias y generar proyecto Android
          npm install
          npx cap add android

          # 4. Restaurar manifiesto con permisos de Health Connect
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

          npx cap sync android

          # 5. Compilar APK
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: KetoTrack-Android-APK
          path: keto-tracker/android/app/build/outputs/apk/debug/app-debug.apk
