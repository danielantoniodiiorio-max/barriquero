          // Dibuja curvas suaves Bézier (Catmull-Rom Spline) en HTML5 Canvas
          function drawSmoothSplineOnCanvas(canvas, seriesList, xLabels, options = {}) {
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);

            const w = rect.width;
            const h = rect.height;
            const padLeft = 45;
            const padRight = 15;
            const padTop = 20;
            const padBottom = 30;
            const plotW = w - padLeft - padRight;
            const plotH = h - padTop - padBottom;

            ctx.clearRect(0, 0, w, h);

            // Encontrar valor máximo para escala Y
            let maxVal = 0;
            for (const s of seriesList) {
              for (const v of s.values) {
                if (v > maxVal) maxVal = v;
              }
            }
            maxVal = Math.max(10, Math.ceil(maxVal * 1.15));

            // Líneas horizontales de guía (Grid)
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.07)';
            ctx.lineWidth = 1;
            const gridSteps = 4;
            for (let i = 0; i <= gridSteps; i++) {
              const y = padTop + (plotH / gridSteps) * i;
              ctx.beginPath();
              ctx.moveTo(padLeft, y);
              ctx.lineTo(w - padRight, y);
              ctx.stroke();

              const val = Math.round(maxVal - (maxVal / gridSteps) * i);
              ctx.fillStyle = '#64748b';
              ctx.font = '10px -apple-system, sans-serif';
              ctx.textAlign = 'right';
              ctx.fillText(options.formatY ? options.formatY(val) : val.toLocaleString(), padLeft - 6, y + 3);
            }

            const numPoints = xLabels.length;
            const stepX = numPoints > 1 ? plotW / (numPoints - 1) : (plotW / 2);

            // Dibujar cada serie con curva Bézier suave
            for (const series of seriesList) {
              const points = [];
              for (let i = 0; i < series.values.length; i++) {
                const px = numPoints === 1 ? (padLeft + plotW / 2) : (padLeft + i * stepX);
                const py = padTop + plotH - (series.values[i] / maxVal) * plotH;
                points.push({ x: px, y: py });
              }

              if (points.length === 1) {
                const p = points[0];
                ctx.save();
                ctx.strokeStyle = series.color + '44';
                ctx.setLineDash([3, 3]);
                ctx.beginPath();
                ctx.moveTo(padLeft, p.y);
                ctx.lineTo(w - padRight, p.y);
                ctx.stroke();
                ctx.restore();

                ctx.beginPath();
                ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
                ctx.fillStyle = series.color;
                ctx.fill();
                ctx.lineWidth = 2.5;
                ctx.strokeStyle = '#0f172a';
                ctx.stroke();

                ctx.fillStyle = series.color;
                ctx.font = 'bold 11px -apple-system, sans-serif';
                ctx.textAlign = 'center';
                const valStr = options.formatY ? options.formatY(series.values[0]) : series.values[0];
                ctx.fillText(valStr, p.x, p.y - 12);
                continue;
              }

              if (points.length < 2) continue;

              // 1. Área con degradado suave
              const grad = ctx.createLinearGradient(0, padTop, 0, padTop + plotH);
              grad.addColorStop(0, series.color + '44');
              grad.addColorStop(1, series.color + '00');

              ctx.beginPath();
              ctx.moveTo(points[0].x, points[0].y);
              for (let i = 0; i < points.length - 1; i++) {
                const p0 = i === 0 ? points[0] : points[i - 1];
                const p1 = points[i];
                const p2 = points[i + 1];
                const p3 = i + 2 >= points.length ? points[i + 1] : points[i + 2];

                const cp1x = p1.x + (p2.x - p0.x) / 6;
                const cp1y = p1.y + (p2.y - p0.y) / 6;
                const cp2x = p2.x - (p3.x - p1.x) / 6;
                const cp2y = p2.y - (p3.y - p1.y) / 6;
                ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, p2.x, p2.y);
              }
              ctx.lineTo(points[points.length - 1].x, padTop + plotH);
              ctx.lineTo(points[0].x, padTop + plotH);
              ctx.closePath();
              ctx.fillStyle = grad;
              ctx.fill();

              // 2. Línea suavizada principal
              ctx.beginPath();
              ctx.moveTo(points[0].x, points[0].y);
              for (let i = 0; i < points.length - 1; i++) {
                const p0 = i === 0 ? points[0] : points[i - 1];
                const p1 = points[i];
                const p2 = points[i + 1];
                const p3 = i + 2 >= points.length ? points[i + 1] : points[i + 2];

                const cp1x = p1.x + (p2.x - p0.x) / 6;
                const cp1y = p1.y + (p2.y - p0.y) / 6;
                const cp2x = p2.x - (p3.x - p1.x) / 6;
                const cp2y = p2.y - (p3.y - p1.y) / 6;
                ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, p2.x, p2.y);
              }
              ctx.strokeStyle = series.color;
              ctx.lineWidth = 3;
              ctx.stroke();

              // 3. Puntos circulares
              for (const p of points) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#0f172a';
                ctx.fill();
                ctx.lineWidth = 2.5;
                ctx.strokeStyle = series.color;
                ctx.stroke();
              }
            }

            // Etiquetas del Eje X
            ctx.fillStyle = '#94a3b8';
            ctx.font = '10px -apple-system, sans-serif';
            ctx.textAlign = 'center';
            const labelSkip = numPoints > 10 ? Math.ceil(numPoints / 6) : 1;

            for (let i = 0; i < numPoints; i++) {
              if (i % labelSkip === 0 || i === numPoints - 1) {
                const px = numPoints === 1 ? (padLeft + plotW / 2) : (padLeft + i * stepX);
                ctx.fillText(xLabels[i], px, h - 8);
              }
            }
          }

          // Renderiza la vista de Gráficas completa
          function renderChartsView() {
            const history = syncTodayToDailyHistory();
            const count = activeChartRange === 'week' ? 7 : 30;
            const slice = history.slice(-count);

            const xLabels = slice.map(h => {
              const parts = h.date.split('-');
              return parts[2] + '/' + parts[1];
            });

            const legendEl = document.getElementById('chartLegend');
            const canvas = document.getElementById('canvasKetoChart');
            let seriesList = [];
            let formatY = v => v;

            if (activeChartMetric === 'steps') {
              seriesList = [
                { name: 'Pasos Garmin', color: '#10b981', values: slice.map(h => h.steps) },
                { name: 'Gasto Activo (kcal)', color: '#38bdf8', values: slice.map(h => h.calories_out) }
              ];
              formatY = v => v >= 1000 ? (v / 1000).toFixed(1) + 'k' : v;
            } else if (activeChartMetric === 'macros') {
              seriesList = [
                { name: 'Carbos Netos (g)', color: '#f59e0b', values: slice.map(h => h.net_carbs) },
                { name: 'Grasas (g)', color: '#10b981', values: slice.map(h => h.fat) },
                { name: 'Proteínas (g)', color: '#38bdf8', values: slice.map(h => h.protein) }
              ];
              formatY = v => v + 'g';
            } else if (activeChartMetric === 'calories') {
              seriesList = [
                { name: 'Calorías Ingeridas', color: '#f59e0b', values: slice.map(h => h.calories_in) },
                { name: 'Calorías Quemadas Garmin', color: '#10b981', values: slice.map(h => h.calories_out) }
              ];
              formatY = v => v + ' kcal';
            }

            // Leyenda interactiva
            if (legendEl) {
              legendEl.innerHTML = seriesList.map(s => `
                <div class="legend-item">
                  <span class="legend-dot" style="background-color: ${s.color}"></span>
                  <span>${s.name}</span>
                </div>
              `).join('');
            }

            // Resumen promedio del período
            const avgSteps = Math.round(slice.reduce((acc, c) => acc + c.steps, 0) / slice.length);
            const avgCalOut = Math.round(slice.reduce((acc, c) => acc + c.calories_out, 0) / slice.length);
            const avgCarbs = Math.round((slice.reduce((acc, c) => acc + c.net_carbs, 0) / slice.length) * 10) / 10;

            const elStat1 = document.getElementById('valStat1');
            if (elStat1) elStat1.textContent = avgSteps.toLocaleString();

            const elStat2 = document.getElementById('valStat2');
            if (elStat2) elStat2.textContent = avgCalOut.toLocaleString() + ' kcal';

            const elStat3 = document.getElementById('valStat3');
            if (elStat3) elStat3.textContent = avgCarbs + ' g';

            const badgeCount = document.getElementById('badgeHistoryCount');
            if (badgeCount) badgeCount.textContent = slice.length === 1 ? '1 día registrado' : (slice.length + ' días registrados');

            // Dibujar Canvas
            drawSmoothSplineOnCanvas(canvas, seriesList, xLabels, { formatY });

            // Lista detallada día a día
            const historyListEl = document.getElementById('chartHistoryList');
            if (historyListEl) {
              historyListEl.innerHTML = [...slice].reverse().map(h => `
                <div class="history-day-row">
                  <div class="history-day-left">
                    <span class="history-day-date">📅 ${h.date} (${h.day_label})</span>
                    <span class="history-day-detail">${h.steps.toLocaleString()} pasos • ${h.calories_out.toLocaleString()} kcal Garmin</span>
                  </div>
                  <div class="history-day-metrics">
                    <span style="color:#f59e0b">${h.net_carbs}g C</span>
                    <span style="color:#10b981">${h.fat}g G</span>
                    <span style="color:#38bdf8">${h.protein}g P</span>
                  </div>
                </div>
              `).join('');
            }
          }

          // Configurar listeners de la pestaña de Gráficas
          function setupChartsTabListeners() {
            document.getElementById('btnRangeWeek')?.addEventListener('click', () => {
              activeChartRange = 'week';
              document.getElementById('btnRangeWeek')?.classList.add('active');
              document.getElementById('btnRangeMonth')?.classList.remove('active');
              renderChartsView();
            });

            document.getElementById('btnRangeMonth')?.addEventListener('click', () => {
              activeChartRange = 'month';
              document.getElementById('btnRangeMonth')?.classList.add('active');
              document.getElementById('btnRangeWeek')?.classList.remove('active');
              renderChartsView();
            });

            // Botón directo para vaciar historial de esta pantalla y empezar de cero
            document.getElementById('btnClearChartHistory')?.addEventListener('click', () => {
              const conf = confirm('¿Deseas vaciar todo el historial de esta pantalla para empezar de cero?');
              if (!conf) return;

              const now = new Date();
              const todayKey = now.toISOString().slice(0, 10);
              const days = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
              const freshToday = [{
                date: todayKey,
                day_label: 'Hoy (' + days[now.getDay()] + ')',
                steps: Number(state.status?.garmin?.steps || 0),
                calories_out: Number(state.status?.garmin?.active_calories || 0),
                calories_in: 0,
                net_carbs: 0,
                fat: 0,
                protein: 0,
                ketones: 0.2
              }];
              localStorage.setItem('ketotrack_daily_history', JSON.stringify(freshToday));
              renderChartsView();
              alert('¡Historial vaciado! La pantalla ahora comienza limpia desde hoy en Día 1.');
            });

            document.querySelectorAll('.metric-pill').forEach(btn => {
              btn.addEventListener('click', () => {
                document.querySelectorAll('.metric-pill').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeChartMetric = btn.dataset.metric || 'steps';
                renderChartsView();
              });
            });

            window.addEventListener('resize', () => {
              const tabCharts = document.getElementById('tab-charts');
              if (tabCharts && tabCharts.classList.contains('active')) {
                renderChartsView();
              }
            });
          }

          // Configurar modal de Iniciar Proceso seguro
          function setupStartProcessModal() {
            const modal = document.getElementById('modalStartProcess');
            const btnOpen = document.getElementById('btnOpenStartProcessModal');
            const btnClose = document.getElementById('btnCloseProcessModal');
            const btnCancel = document.getElementById('btnCancelProcessModal');
            const btnKeep = document.getElementById('btnStartKeepHistory');
            const btnReset = document.getElementById('btnStartResetAll');

            btnOpen?.addEventListener('click', () => {
              if (modal) modal.classList.add('show');
            });

            const closeModal = () => {
              if (modal) modal.classList.remove('show');
            };

            btnClose?.addEventListener('click', closeModal);
            btnCancel?.addEventListener('click', closeModal);

            // Función para reiniciar todo a cero absoluto (Día 1 con historial limpio)
            const resetAllToZero = () => {
              const now = new Date();
              state.meals = [];
              localStorage.setItem('ketotrack_meals', JSON.stringify([]));

              // 1. Borrar TODO el historial de la pantalla de gráficas para empezar de cero
              localStorage.removeItem('ketotrack_daily_history');
              const todayKey = now.toISOString().slice(0, 10);
              const days = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
              const freshToday = [{
                date: todayKey,
                day_label: 'Hoy (' + days[now.getDay()] + ')',
                steps: Number(state.status?.garmin?.steps || 0),
                calories_out: Number(state.status?.garmin?.active_calories || 0),
                calories_in: 0,
                net_carbs: 0,
                fat: 0,
                protein: 0,
                ketones: 0.2
              }];
              localStorage.setItem('ketotrack_daily_history', JSON.stringify(freshToday));

              // 2. Reiniciar pesajes dejando solo el peso base actual de hoy
              const currentWeight = Number(state.settings.weight || 80.0);
              state.weights = [{
                id: Date.now(),
                weight: currentWeight,
                date: now.toISOString(),
                source: 'Inicio Día 1'
              }];
              localStorage.setItem('ketotrack_weights', JSON.stringify(state.weights));

              // 3. Reiniciar fecha de inicio a hoy
              state.settings.keto_start_date = now.toISOString();
              localStorage.setItem('ketotrack_settings', JSON.stringify(state.settings));

              closeModal();
              renderMealsList([]);
              recalculateClientState();
              renderChartsView();
              if (typeof renderWeightComparison === 'function') renderWeightComparison();
              alert('¡Proceso iniciado desde cero!\n\nSe ha borrado todo el historial de gráficas, comidas y estadísticas anteriores para arrancar limpio en el Día 1 hoy.');
            };

            // Opción 1: Iniciar Proceso Desde Cero (Recomendado)
            btnReset?.addEventListener('click', () => {
              const conf = confirm('¿Confirmas INICIAR EL PROCESO DESDE CERO?\n\nSe vaciará todo el historial de la pantalla de gráficas, las comidas y comenzarás limpio en el Día 1.');
              if (!conf) return;
              resetAllToZero();
            });

            // Opción 2: Iniciar Día 1 conservando historial
            btnKeep?.addEventListener('click', () => {
              const now = new Date();
              state.settings.keto_start_date = now.toISOString();
              localStorage.setItem('ketotrack_settings', JSON.stringify(state.settings));
              closeModal();
              recalculateClientState();
              renderChartsView();
              alert('¡Proceso iniciado hoy en Día 1!\nSe conservó el historial previo.');
            });
          }

          async function initApp() {
            loadSettings();
            loadWeights();
            loadMeals();
            recalculateClientState();
            setupChartsTabListeners();
            setupWeightChartListeners();
            setupStartProcessModal();
            syncTodayToDailyHistory();
            if (typeof renderWeightComparison === 'function') {
              renderWeightComparison();
            }
          }

          window.addEventListener('DOMContentLoaded', initApp);
          try { initApp(); } catch (e) {}

          EOF

          # 4. Escribir public/health-connect.js
          cat << 'EOF' > public/health-connect.js
          /**
           * Cliente de Sincronización Automática con Google Health Connect (Android 15)
           * Lee pasos, calorías activas, ritmo cardíaco y peso directamente de Garmin a través de Health Connect.
           */

          class HealthConnectManager {
            constructor() {
              this.isNative = false;
              this.plugin = null;
              this.init();
            }

            getPlugin() {
              if (window.Capacitor) {
                if (window.Capacitor.Plugins && window.Capacitor.Plugins.Health) {
                  return window.Capacitor.Plugins.Health;
                }
                if (typeof window.Capacitor.registerPlugin === 'function') {
                  try {
                    return window.Capacitor.registerPlugin('Health');
                  } catch (e) {
                    console.warn('Error al invocar registerPlugin("Health"):', e);
                  }
                }
              }
              return null;
            }

            async init() {
              if (window.Capacitor) {
                this.isNative = typeof window.Capacitor.isNativePlatform === 'function' 
                  ? window.Capacitor.isNativePlatform() 
                  : true;
                this.plugin = this.getPlugin();
              }

              this.bindUI();

              if (this.isNative) {
                console.log('📱 Modo Nativo Android detectado. Verificando Health Connect...');
                this.updateUIStatus('Modo Nativo Android detectado. Sincronizando con Garmin...');
                setTimeout(async () => {
                  this.plugin = this.getPlugin();
                  await this.setupAutoSync();
                }, 500);
              } else {
                console.log('💻 Modo Web detectado.');
                this.updateUIStatus('Modo navegador web (Health Connect se activa en la app Android).');
              }
            }

            bindUI() {
              const btnConnect = document.getElementById('btnConnectHealthConnect');
              if (btnConnect) {
                btnConnect.addEventListener('click', async () => {
                  btnConnect.disabled = true;
                  btnConnect.textContent = '⏳ Sincronizando...';
                  await this.requestPermissionAndSync();
                  btnConnect.disabled = false;
                  btnConnect.innerHTML = '🔄 Sincronizar Ahora';
                });
              }
            }

            async setupAutoSync() {
              await this.requestPermissionAndSync(true);

              document.addEventListener('visibilitychange', () => {
                if (!document.hidden) {
                  this.syncFromHealthConnect();
                }
              });

              setInterval(() => {
                if (!document.hidden) {
                  this.syncFromHealthConnect();
                }
              }, 3 * 60 * 1000);
            }

            async requestPermissionAndSync(isSilent = false) {
              this.plugin = this.getPlugin();
              if (!this.plugin) {
                if (!isSilent) {
                  alert('El plugin nativo de Health Connect se está iniciando. Reintenta en unos instantes.');
                }
                return false;
              }

              try {
                this.updateUIStatus('Verificando disponibilidad de Health Connect...');
                const availability = await this.plugin.isAvailable().catch(e => ({ available: false, reason: e.message }));
                if (availability && availability.available === false) {
                  const msg = availability.reason || 'Health Connect no está activo en este dispositivo.';
                  this.updateUIStatus('Aviso: ' + msg);
                  return false;
                }

                this.updateUIStatus('Solicitando permisos a Android 15...');
                await this.plugin.requestAuthorization({
                  read: ['steps', 'calories', 'heartRate', 'restingHeartRate', 'weight'],
                  write: [],
                  requestHistoryAccess: true
                });

                this.updateUIStatus('Permisos concedidos. Leyendo métricas de Garmin...');
                await this.syncFromHealthConnect();
                return true;

              } catch (err) {
                console.error('Error al conectar con Health Connect:', err);
                this.updateUIStatus('Error al conectar: ' + (err.message || err));
                return false;
              }
            }

            async syncFromHealthConnect() {
              this.plugin = this.getPlugin();
              if (!this.plugin) return;

              try {
                const now = new Date();
                const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0);

                // 1. Leer pasos de hoy
                let steps = 0;
                try {
                  const stepsRes = await this.plugin.readSamples({
                    dataType: 'steps',
                    startDate: startOfDay.toISOString(),
                    endDate: now.toISOString(),
                    limit: 2000
                  });
                  if (stepsRes && Array.isArray(stepsRes.samples)) {
                    steps = Math.round(stepsRes.samples.reduce((acc, s) => acc + (Number(s.value) || 0), 0));
                  }
                } catch (e) {
                  console.warn('Error leyendo pasos:', e);
                }

                // 2. Leer calorías activas
                let activeCalories = 0;
                try {
                  const calRes = await this.plugin.readSamples({
                    dataType: 'calories',
                    startDate: startOfDay.toISOString(),
                    endDate: now.toISOString(),
                    limit: 1500
                  });
                  if (calRes && Array.isArray(calRes.samples) && calRes.samples.length > 0) {
                    activeCalories = Math.round(calRes.samples.reduce((acc, s) => acc + (Number(s.value) || 0), 0));
                  }
                } catch (e) {
                  console.warn('Error leyendo calorías activas:', e);
                }

                // Calibración exacta para Garmin Instinct (34.2 kcal por cada 1000 pasos)
                if (activeCalories === 0 && steps > 0) {
                  activeCalories = Math.round(steps * 0.0342);
                }

                // 3. Leer frecuencia cardíaca en reposo
                let restingHr = 60;
                try {
                  const rhrRes = await this.plugin.readSamples({
                    dataType: 'restingHeartRate',
                    startDate: startOfDay.toISOString(),
                    endDate: now.toISOString(),
                    limit: 1,
                    ascending: false
                  });
                  if (rhrRes && rhrRes.samples && rhrRes.samples.length > 0) {
                    restingHr = Math.round(rhrRes.samples[0].value || 60);
                  } else {
                    const hrRes = await this.plugin.readSamples({
                      dataType: 'heartRate',
                      startDate: startOfDay.toISOString(),
                      endDate: now.toISOString(),
                      limit: 1,
                      ascending: false
                    });
                    if (hrRes && hrRes.samples && hrRes.samples.length > 0) {
                      restingHr = Math.round(hrRes.samples[0].value || 60);
                    }
                  }
                } catch (e) {
                  console.warn('Error leyendo ritmo cardíaco:', e);
                }

                // 4. Leer peso corporal de balanza inteligente si está disponible
                try {
                  const weightRes = await this.plugin.readSamples({
                    dataType: 'weight',
                    startDate: new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000).toISOString(),
                    endDate: now.toISOString(),
                    limit: 1,
                    ascending: false
                  });
                  if (weightRes && weightRes.samples && weightRes.samples.length > 0) {
                    const wKg = weightRes.samples[0].value;
                    if (window.applyGarminWeight) {
                      window.applyGarminWeight(wKg, 'Health Connect (Garmin)');
                    }
                  }
                } catch (e) {
                  console.warn('Error leyendo peso:', e);
                }

                // 5. Actualizar estado y recalcular motor de cetosis inmediatamente
                if (window.applyGarminMetrics) {
                  window.applyGarminMetrics(steps, activeCalories, restingHr, 'Google Health Connect (Garmin)');
                }

                const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                this.updateUIStatus('Sincronizado: ' + timeStr + ' • ' + steps.toLocaleString() + ' pasos y ' + activeCalories + ' kcal de Garmin.');

              } catch (err) {
                console.error('Fallo en sincronización con Health Connect:', err);
                this.updateUIStatus('Error al sincronizar datos: ' + (err.message || err));
              }
            }

            updateUIStatus(msg) {
              const el = document.getElementById('healthConnectStatusText');
              if (el) {
                el.textContent = msg;
              }
            }
          }

          // Instancia global
          window.healthConnectManager = new HealthConnectManager();

          EOF

      - name: Instalar Dependencias npm
        run: |
          if [ -d "keto-tracker" ]; then
            cd keto-tracker
          fi
          npm install

      - name: Configurar Proyecto Android y Permisos
        run: |
          if [ -d "keto-tracker" ]; then
            cd keto-tracker
          fi
          rm -rf android
          npx cap add android

          # 1. Configurar variables.gradle con minSdk 26 y compileSdk 35
          node -e "
            const fs = require('fs');
            let vg = fs.readFileSync('android/variables.gradle', 'utf8');
            vg = vg.replace(/minSdkVersion\s*=\s*\d+/, 'minSdkVersion = 26');
            vg = vg.replace(/compileSdkVersion\s*=\s*\d+/, 'compileSdkVersion = 35');
            vg = vg.replace(/targetSdkVersion\s*=\s*\d+/, 'targetSdkVersion = 35');
            if (!vg.includes('kotlinVersion')) {
              vg = vg.replace(/ext\s*\{/, \"ext {\n    kotlinVersion = '1.9.24'\");
            }
            fs.writeFileSync('android/variables.gradle', vg, 'utf8');
          "

          # 2. Configurar android/build.gradle con Kotlin Gradle plugin
          node -e "
            const fs = require('fs');
            let bg = fs.readFileSync('android/build.gradle', 'utf8');
            if (!bg.includes('kotlin-gradle-plugin')) {
              bg = bg.replace(/dependencies\s*\{/, \"dependencies {\n        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24'\");
              fs.writeFileSync('android/build.gradle', bg, 'utf8');
            }
          "

          # 3. Inyectar AndroidManifest.xml con permisos de Health Connect y Rationale oficial
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.health.READ_STEPS" />
              <uses-permission android:name="android.permission.health.READ_ACTIVE_CALORIES_BURNED" />
              <uses-permission android:name="android.permission.health.READ_TOTAL_CALORIES_BURNED" />
              <uses-permission android:name="android.permission.health.READ_HEART_RATE" />
              <uses-permission android:name="android.permission.health.READ_RESTING_HEART_RATE" />
              <uses-permission android:name="android.permission.health.READ_HEALTH_DATA_HISTORY" />

              <queries>
                  <package android:name="com.google.android.apps.healthdata" />
                  <intent>
                      <action android:name="androidx.health.ACTION_SHOW_PERMISSIONS_RATIONALE" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="KetoTrack"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"
                      android:name=".MainActivity"
                      android:label="KetoTrack"
                      android:theme="@android:style/Theme.DeviceDefault.NoActionBar"
                      android:launchMode="singleTask"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                      <intent-filter>
                          <action android:name="androidx.health.ACTION_SHOW_PERMISSIONS_RATIONALE" />
                      </intent-filter>
                  </activity>

                  <activity-alias
                      android:name="ViewPermissionUsageActivity"
                      android:exported="true"
                      android:targetActivity=".MainActivity"
                      android:permission="android.permission.START_VIEW_PERMISSION_USAGE">
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW_PERMISSION_USAGE" />
                          <category android:name="android.intent.category.HEALTH_PERMISSIONS" />
                      </intent-filter>
                  </activity-alias>
              </application>
          </manifest>
          EOF

          # 4. Sincronizar plugins de Capacitor en el proyecto Android
          npx cap sync android

          # 5. Configurar android/app/build.gradle con Java 21 y Desugaring
          node -e "
            const fs = require('fs');
            let abg = fs.readFileSync('android/app/build.gradle', 'utf8');
            if (abg.includes('compileOptions {')) {
              abg = abg.replace(/compileOptions\s*\{[\s\S]*?\}/, \"compileOptions {\n        sourceCompatibility JavaVersion.VERSION_21\n        targetCompatibility JavaVersion.VERSION_21\n        coreLibraryDesugaringEnabled true\n    }\");
            } else {
              abg = abg.replace(/android\s*\{/, \"android {\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_21\n        targetCompatibility JavaVersion.VERSION_21\n        coreLibraryDesugaringEnabled true\n    }\");
            }
            if (!abg.includes('desugar_jdk_libs')) {
              abg = abg.replace(/dependencies\s*\{/, \"dependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\");
            }
            fs.writeFileSync('android/app/build.gradle', abg, 'utf8');
          "

      - name: Compilar APK con Gradle
        run: |
          if [ -d "keto-tracker" ]; then
            cd keto-tracker/android
          else
            cd android
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Guardar APK como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: KetoTrack-Android-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            keto-tracker/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
