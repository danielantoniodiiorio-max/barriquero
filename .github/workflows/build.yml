          // Pre-llenar fecha y hora actual en formulario de peso
          const inWeightDate = document.getElementById('inputWeightDate');
          if (inWeightDate && !inWeightDate.value) {
            inWeightDate.value = new Date().toISOString().slice(0, 16);
          }


          // ==========================================================================
          // 7.B CONTRASTE DE PESO REAL VS. CURVA IDEAL & MEDIDA SEMANAL
          // Algoritmo Wishnofsky / ACSM / OMS: 1 kg grasa = 7.700 kcal de déficit
          // ==========================================================================
          let activeWeightChartRange = '14';

          // Asegura que existan datos de pesaje históricos consistentes para la comparativa
          function ensureWeightHistory(weights, settings, dailyHistory) {
            const currentWeight = Number(settings.weight || 80.0);
            const now = new Date();
            let generated = [...(weights || [])];

            // Si no hay pesaje de hoy, agregar hoy
            const todayStr = now.toISOString().slice(0, 10);
            const hasToday = generated.some(w => (w.date || w.timestamp || '').slice(0, 10) === todayStr);
            if (!hasToday) {
              generated.unshift({
                id: Date.now(),
                weight: currentWeight,
                date: now.toISOString(),
                source: 'Registrado'
              });
            }

            // Cero datos ficticios. Solo registrar pesajes reales del usuario.

            generated.sort((a, b) => new Date(b.date || b.timestamp) - new Date(a.date || a.timestamp));
            return generated;
          }

          // Calcula las trayectorias día a día (Real vs Ideal)
          function calculateWeightTrajectories(range) {
            const dailyHistory = syncTodayToDailyHistory();
            const settings = state.settings || {};
            let weights = ensureWeightHistory(state.weights || [], settings, dailyHistory);
            state.weights = weights;

            // Filtrar según el rango seleccionado: 14, 30 o all
            let dayCount = range === '14' ? 14 : (range === '30' ? 30 : dailyHistory.length);
            dayCount = Math.min(dayCount, dailyHistory.length);
            const slicedHistory = dailyHistory.slice(-dayCount);

            const goalWeight = Number(settings.goal_weight || 75.0);
            const profileWeight = Number(settings.weight || 80.0);
            const heightCm = Number(settings.height || 175);
            const age = Number(settings.age || 35);
            const gender = settings.gender || 'male';

            // BMR Mifflin-St Jeor
            const bmrBase = (10 * profileWeight) + (6.25 * heightCm) - (5 * age) + (gender === 'female' ? -161 : 5);

            // Mapear pesajes reales por día YYYY-MM-DD
            const weightMap = {};
            weights.forEach(w => {
              const dStr = (w.date || w.timestamp || '').slice(0, 10);
              if (dStr && !weightMap[dStr]) {
                weightMap[dStr] = Number(w.weight);
              }
            });

            // Peso inicial para el período
            const firstDayKey = slicedHistory[0].date;
            let startWeight = weightMap[firstDayKey];
            if (!startWeight) {
              const sortedWeightsAsc = [...weights].sort((a, b) => new Date(a.date || a.timestamp) - new Date(b.date || b.timestamp));
              startWeight = sortedWeightsAsc[0] ? Number(sortedWeightsAsc[0].weight) : (profileWeight + 1.5);
            }

            // Interpolar pesajes reales entre fechas conocidas
            const knownIndices = [];
            for (let i = 0; i < slicedHistory.length; i++) {
              if (weightMap[slicedHistory[i].date] !== undefined) {
                knownIndices.push({ index: i, weight: weightMap[slicedHistory[i].date] });
              }
            }
            if (knownIndices.length === 0) {
              knownIndices.push({ index: 0, weight: startWeight });
              knownIndices.push({ index: slicedHistory.length - 1, weight: profileWeight });
            } else if (knownIndices.length === 1) {
              if (knownIndices[0].index > 0) {
                knownIndices.unshift({ index: 0, weight: startWeight });
              } else {
                knownIndices.push({ index: slicedHistory.length - 1, weight: profileWeight });
              }
            }

            function getInterpolatedReal(idx) {
              if (idx <= knownIndices[0].index) return knownIndices[0].weight;
              if (idx >= knownIndices[knownIndices.length - 1].index) return knownIndices[knownIndices.length - 1].weight;
              for (let k = 0; k < knownIndices.length - 1; k++) {
                if (idx >= knownIndices[k].index && idx <= knownIndices[k + 1].index) {
                  const span = knownIndices[k + 1].index - knownIndices[k].index;
                  const frac = span > 0 ? (idx - knownIndices[k].index) / span : 0;
                  return knownIndices[k].weight + frac * (knownIndices[k + 1].weight - knownIndices[k].weight);
                }
              }
              return profileWeight;
            }

            let curIdeal = startWeight;
            const idealPoints = [];
            const realPoints = [];
            const dates = [];

            for (let i = 0; i < slicedHistory.length; i++) {
              const h = slicedHistory[i];
              dates.push(h.date);

              // 1. Pérdida teórica ideal por déficit (Wishnofsky / ACSM)
              const tdeeToday = Math.round(bmrBase + (h.calories_out || 400));
              const intakeToday = h.calories_in > 0 ? h.calories_in : (tdeeToday - 500);
              const dailyDeficit = Math.max(150, tdeeToday - intakeToday);
              const dailyLossKg = dailyDeficit / 7700;

              if (i > 0) {
                curIdeal = Math.max(goalWeight, curIdeal - dailyLossKg);
              }
              idealPoints.push(Math.round(curIdeal * 100) / 100);

              // 2. Peso real interpolado o explícito
              const interpReal = Math.round(getInterpolatedReal(i) * 10) / 10;
              const isExplicit = weightMap[h.date] !== undefined;
              realPoints.push({
                weight: interpReal,
                isExplicit: isExplicit
              });
            }

            return {
              dates,
              slicedHistory,
              idealPoints,
              realPoints,
              goalWeight,
              startWeight,
              currentReal: realPoints[realPoints.length - 1].weight,
              currentIdeal: idealPoints[idealPoints.length - 1]
            };
          }

          // Agrupa en bloques de 7 días y contrarresta el avance semanal
          function calculateWeeklyComparison(trajectories) {
            const { dates, slicedHistory, idealPoints, realPoints } = trajectories;
            const weeks = [];
            const totalDays = dates.length;
            const numWeeks = Math.ceil(totalDays / 7);

            for (let w = 0; w < numWeeks; w++) {
              const startIdx = w * 7;
              const endIdx = Math.min(totalDays - 1, (w + 1) * 7 - 1);
              const daysInWeek = endIdx - startIdx + 1;

              const startDate = dates[startIdx];
              const endDate = dates[endIdx];

              const weekRealStart = realPoints[startIdx].weight;
              const weekRealEnd = realPoints[endIdx].weight;
              const deltaReal = Math.round((weekRealEnd - weekRealStart) * 10) / 10;

              const weekIdealStart = idealPoints[startIdx];
              const weekIdealEnd = idealPoints[endIdx];
              const deltaIdeal = Math.round((weekIdealEnd - weekIdealStart) * 10) / 10;

              let weekSteps = 0;
              let weekActiveCal = 0;
              for (let d = startIdx; d <= endIdx; d++) {
                weekSteps += slicedHistory[d].steps || 0;
                weekActiveCal += slicedHistory[d].calories_out || 0;
              }

              let statusText = 'En Meta Óptima';
              let statusBadgeClass = 'badge-success';
              let statusIcon = '🎯';

              // deltaReal y deltaIdeal son negativos (pérdida)
              if (deltaReal <= deltaIdeal - 0.2) {
                statusText = 'Adelantado al Ideal';
                statusBadgeClass = 'badge-cyan';
                statusIcon = '⚡';
              } else if (deltaReal >= deltaIdeal + 0.3) {
                statusText = 'Ajuste Sugerido';
                statusBadgeClass = 'badge-warning';
                statusIcon = '⚠️';
              }

              const isCurrentWeek = (w === numWeeks - 1);

              weeks.push({
                weekNum: w + 1,
                startDate,
                endDate,
                daysInWeek,
                isCurrentWeek,
                startReal: weekRealStart,
                endReal: weekRealEnd,
                endIdeal: weekIdealEnd,
                deltaReal,
                deltaIdeal,
                weekSteps,
                weekActiveCal,
                statusText,
                statusBadgeClass,
                statusIcon
              });
            }

            return weeks;
          }

          // Dibuja en HTML5 Canvas la doble curva de alta definición (Real vs Ideal)
          function renderWeightCompareChart(trajectories) {
            const canvas = document.getElementById('canvasWeightCompareChart');
            if (!canvas) return;

            const ctx = canvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();

            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);

            const w = rect.width;
            const h = rect.height;
            const padLeft = 48;
            const padRight = 18;
            const padTop = 20;
            const padBottom = 30;
            const plotW = w - padLeft - padRight;
            const plotH = h - padTop - padBottom;

            ctx.clearRect(0, 0, w, h);

            const { dates, idealPoints, realPoints, goalWeight } = trajectories;
            const realVals = realPoints.map(r => r.weight);

            // Escala Y dinámica
            const allVals = [...realVals, ...idealPoints, goalWeight];
            let minVal = Math.min(...allVals) - 0.4;
            let maxVal = Math.max(...allVals) + 0.4;
            minVal = Math.floor(minVal * 2) / 2;
            maxVal = Math.ceil(maxVal * 2) / 2;
            const valRange = Math.max(1, maxVal - minVal);

            // Guías horizontales
            const gridSteps = 4;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
            ctx.lineWidth = 1;

            for (let i = 0; i <= gridSteps; i++) {
              const yVal = maxVal - (valRange / gridSteps) * i;
              const y = padTop + (plotH / gridSteps) * i;

              ctx.beginPath();
              ctx.moveTo(padLeft, y);
              ctx.lineTo(w - padRight, y);
              ctx.stroke();

              ctx.fillStyle = '#64748b';
              ctx.font = '10px -apple-system, sans-serif';
              ctx.textAlign = 'right';
              ctx.fillText(yVal.toFixed(1) + ' kg', padLeft - 6, y + 3);
            }

            // Línea horizontal de Meta (Goal Weight)
            const yGoal = padTop + plotH - ((goalWeight - minVal) / valRange) * plotH;
            if (yGoal >= padTop && yGoal <= padTop + plotH) {
              ctx.save();
              ctx.strokeStyle = 'rgba(56, 189, 248, 0.6)';
              ctx.setLineDash([4, 4]);
              ctx.lineWidth = 1.5;
              ctx.beginPath();
              ctx.moveTo(padLeft, yGoal);
              ctx.lineTo(w - padRight, yGoal);
              ctx.stroke();

              ctx.fillStyle = '#38bdf8';
              ctx.font = 'bold 9px -apple-system, sans-serif';
              ctx.textAlign = 'right';
              ctx.fillText('Meta ' + goalWeight.toFixed(1) + ' kg', w - padRight - 4, yGoal - 4);
              ctx.restore();
            }

            const numPoints = dates.length;
            const stepX = numPoints > 1 ? plotW / (numPoints - 1) : plotW;

            // 1. Dibujar Curva Ideal (Violeta luminoso punteado suave)
            const idealCoords = [];
            for (let i = 0; i < idealPoints.length; i++) {
              const px = padLeft + i * stepX;
              const py = padTop + plotH - ((idealPoints[i] - minVal) / valRange) * plotH;
              idealCoords.push({ x: px, y: py });
            }

            if (idealCoords.length >= 2) {
              ctx.save();
              ctx.beginPath();
              ctx.moveTo(idealCoords[0].x, idealCoords[0].y);
              for (let i = 0; i < idealCoords.length - 1; i++) {
                const p0 = i === 0 ? idealCoords[0] : idealCoords[i - 1];
                const p1 = idealCoords[i];
                const p2 = idealCoords[i + 1];
                const p3 = i + 2 >= idealCoords.length ? idealCoords[i + 1] : idealCoords[i + 2];

                const cp1x = p1.x + (p2.x - p0.x) / 6;
                const cp1y = p1.y + (p2.y - p0.y) / 6;
                const cp2x = p2.x - (p3.x - p1.x) / 6;
                const cp2y = p2.y - (p3.y - p1.y) / 6;
                ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, p2.x, p2.y);
              }
              ctx.strokeStyle = '#c084fc';
              ctx.lineWidth = 2.5;
              ctx.setLineDash([5, 4]);
              ctx.stroke();
              ctx.restore();
            }

            // 2. Dibujar Curva Real (Esmeralda #10b981 con degradado y nodos)
            const realCoords = [];
            for (let i = 0; i < realVals.length; i++) {
              const px = padLeft + i * stepX;
              const py = padTop + plotH - ((realVals[i] - minVal) / valRange) * plotH;
              realCoords.push({ x: px, y: py, isExplicit: realPoints[i].isExplicit, val: realVals[i] });
            }

            if (realCoords.length >= 2) {
              // Área con degradado esmeralda
              const grad = ctx.createLinearGradient(0, padTop, 0, padTop + plotH);
              grad.addColorStop(0, 'rgba(16, 185, 129, 0.32)');
              grad.addColorStop(1, 'rgba(16, 185, 129, 0.00)');

              ctx.beginPath();
              ctx.moveTo(realCoords[0].x, realCoords[0].y);
              for (let i = 0; i < realCoords.length - 1; i++) {
                const p0 = i === 0 ? realCoords[0] : realCoords[i - 1];
                const p1 = realCoords[i];
                const p2 = realCoords[i + 1];
                const p3 = i + 2 >= realCoords.length ? realCoords[i + 1] : realCoords[i + 2];

                const cp1x = p1.x + (p2.x - p0.x) / 6;
                const cp1y = p1.y + (p2.y - p0.y) / 6;
                const cp2x = p2.x - (p3.x - p1.x) / 6;
                const cp2y = p2.y - (p3.y - p1.y) / 6;
                ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, p2.x, p2.y);
              }
              ctx.lineTo(realCoords[realCoords.length - 1].x, padTop + plotH);
              ctx.lineTo(realCoords[0].x, padTop + plotH);
              ctx.closePath();
              ctx.fillStyle = grad;
              ctx.fill();

              // Línea continua sólida
              ctx.beginPath();
              ctx.moveTo(realCoords[0].x, realCoords[0].y);
              for (let i = 0; i < realCoords.length - 1; i++) {
                const p0 = i === 0 ? realCoords[0] : realCoords[i - 1];
                const p1 = realCoords[i];
                const p2 = realCoords[i + 1];
                const p3 = i + 2 >= realCoords.length ? realCoords[i + 1] : realCoords[i + 2];

                const cp1x = p1.x + (p2.x - p0.x) / 6;
                const cp1y = p1.y + (p2.y - p0.y) / 6;
                const cp2x = p2.x - (p3.x - p1.x) / 6;
                const cp2y = p2.y - (p3.y - p1.y) / 6;
                ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, p2.x, p2.y);
              }
              ctx.strokeStyle = '#10b981';
              ctx.lineWidth = 3;
              ctx.stroke();

              // Puntos/nodos
              for (const p of realCoords) {
                ctx.beginPath();
                const radius = p.isExplicit ? 5 : 3.5;
                ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
                ctx.fillStyle = p.isExplicit ? '#10b981' : '#047857';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#0f172a';
                ctx.stroke();
              }
            }

            // Eje X fechas
            ctx.fillStyle = '#94a3b8';
            ctx.font = '10px -apple-system, sans-serif';
            ctx.textAlign = 'center';
            const labelSkip = numPoints > 10 ? Math.ceil(numPoints / 6) : 1;

            for (let i = 0; i < numPoints; i++) {
              if (i % labelSkip === 0 || i === numPoints - 1) {
                const parts = dates[i].split('-');
                const label = parts[2] + '/' + parts[1];
                const px = padLeft + i * stepX;
                ctx.fillText(label, px, h - 8);
              }
            }
          }

          // Renderiza las tarjetas de resumen y desglose semanal
          function renderWeightWeeklyView(trajectories, weeks) {
            const container = document.getElementById('weightWeeklyBreakdown');
            const { startWeight, currentReal, currentIdeal, goalWeight } = trajectories;

            // 1. Métricas Hero
            const totalRealLoss = Math.round((currentReal - startWeight) * 10) / 10;
            const totalIdealLoss = Math.round((currentIdeal - startWeight) * 10) / 10;

            const elRealLoss = document.getElementById('valWeightRealLoss');
            if (elRealLoss) {
              elRealLoss.textContent = (totalRealLoss <= 0 ? '' : '+') + totalRealLoss.toFixed(1) + ' kg';
              elRealLoss.className = totalRealLoss <= 0 ? 'w-val text-success' : 'w-val text-warning';
            }

            const elIdealLoss = document.getElementById('valWeightIdealLoss');
            if (elIdealLoss) {
              elIdealLoss.textContent = (totalIdealLoss <= 0 ? '' : '+') + totalIdealLoss.toFixed(1) + ' kg';
            }

            // Ritmo semanal promedio
            const lastWeek = weeks[weeks.length - 1];
            const avgWeeklyRate = lastWeek ? lastWeek.deltaReal : (totalRealLoss / Math.max(1, weeks.length));
            const elWeeklyRate = document.getElementById('valWeightWeeklyRate');
            if (elWeeklyRate) {
              elWeeklyRate.textContent = (avgWeeklyRate <= 0 ? '' : '+') + avgWeeklyRate.toFixed(1) + ' kg/sem';
            }

            // Estado Metabólico y Diferencia
            const elStatus = document.getElementById('valWeightPaceStatus');
            const elDiff = document.getElementById('subWeightPaceDiff');
            const paceDiff = Math.round((currentReal - currentIdeal) * 10) / 10;

            if (elStatus && elDiff) {
              if (paceDiff <= -0.2) {
                elStatus.textContent = '⚡ Adelantado';
                elStatus.style.color = '#38bdf8';
                elDiff.textContent = Math.abs(paceDiff).toFixed(1) + ' kg menos de lo proyectado';
              } else if (paceDiff <= 0.2) {
                elStatus.textContent = '🎯 En Ritmo Ideal';
                elStatus.style.color = '#10b981';
                elDiff.textContent = 'Sincronizado con meta metabólica';
              } else {
                elStatus.textContent = '⚠️ Ajuste Sugerido';
                elStatus.style.color = '#f59e0b';
                elDiff.textContent = '+' + paceDiff.toFixed(1) + ' kg vs ideal proyectado';
              }
            }

            const badgeWeeks = document.getElementById('badgeTotalWeeks');
            if (badgeWeeks) {
              badgeWeeks.textContent = weeks.length === 1 ? '1 Semana Registrada' : (weeks.length + ' Semanas Registradas');
            }

            const legendGoal = document.getElementById('txtLegendGoalWeight');
            if (legendGoal) legendGoal.textContent = goalWeight.toFixed(1) + ' kg';

            // 2. Renderizar Tarjetas Semanales
            if (!container) return;
            if (weeks.length === 0) {
              container.innerHTML = '<div class="loading-placeholder">Sin datos suficientes para desglosar semanas.</div>';
              return;
            }

            container.innerHTML = [...weeks].reverse().map(w => {
              const sParts = w.startDate.split('-');
              const eParts = w.endDate.split('-');
              const rangeText = sParts[2] + '/' + sParts[1] + ' al ' + eParts[2] + '/' + eParts[1];

              const deltaSign = w.deltaReal <= 0 ? '' : '+';
              const idealDeltaSign = w.deltaIdeal <= 0 ? '' : '+';

              return `
                <div class="weekly-card">
                  <div class="weekly-card-header">
                    <div class="weekly-card-title">
                      <strong>Semana ${w.weekNum} ${w.isCurrentWeek ? '<small style="color:#38bdf8">(En curso)</small>' : ''}</strong>
                      <span>📅 ${rangeText}</span>
                    </div>
                    <span class="badge ${w.statusBadgeClass}">${w.statusIcon} ${w.statusText}</span>
                  </div>

                  <div class="weekly-card-body">
                    <div class="weekly-col">
                      <span class="weekly-col-lbl">Peso Cierre</span>
                      <strong class="weekly-col-val">${w.endReal.toFixed(1)} kg</strong>
                    </div>
                    <div class="weekly-col">
                      <span class="weekly-col-lbl">Δ Peso Real</span>
                      <strong class="weekly-col-val" style="color: ${w.deltaReal <= 0 ? '#10b981' : '#f59e0b'};">
                        ${deltaSign}${w.deltaReal.toFixed(1)} kg
                      </strong>
                    </div>
                    <div class="weekly-col">
                      <span class="weekly-col-lbl">Δ Ideal (Keto)</span>
                      <strong class="weekly-col-val" style="color: #c084fc;">
                        ${idealDeltaSign}${w.deltaIdeal.toFixed(1)} kg
                      </strong>
                    </div>
                  </div>

                  <div class="weekly-garmin-strip">
                    <span>⌚ <strong>Garmin:</strong> ${w.weekSteps.toLocaleString()} pasos totales</span>
                    <span>🔥 <strong>${w.weekActiveCal.toLocaleString()} kcal</strong> activas quemadas</span>
                  </div>
                </div>
              `;
            }).join('');
          }

