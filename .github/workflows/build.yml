          :root {
            --bg-color: #0b1120;
            --card-bg: #131d33;
            --card-border: #1f2e4d;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #10b981;
            --accent-cyan: #06b6d4;
            --accent-amber: #f59e0b;
            --accent-red: #ef4444;
            --accent-purple: #8b5cf6;
            --font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
          }

          * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
          }

          body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-family);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 0;
          }

          .app-container {
            width: 100%;
            max-width: 500px;
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            padding-bottom: 30px;
          }

          /* Header */
          .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: rgba(19, 29, 51, 0.7);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--card-border);
          }

          .brand {
            display: flex;
            align-items: center;
            gap: 12px;
          }

          .logo-icon {
            font-size: 28px;
          }

          .brand h1 {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.5px;
          }

          .subtext {
            font-size: 0.75rem;
            color: var(--accent-cyan);
            font-weight: 600;
            display: block;
          }

          .btn-icon {
            background: var(--card-border);
            border: none;
            font-size: 1.1rem;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease, background-color 0.2s ease;
          }

          .btn-icon:active {
            transform: scale(0.92);
          }

          /* Tabs */
          .nav-tabs {
            display: flex;
            background: var(--card-bg);
            margin: 12px 16px;
