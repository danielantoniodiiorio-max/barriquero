          .free-sync-banner {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.35);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            font-size: 0.78rem;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #a7f3d0;
            line-height: 1.35;
          }

          .free-tag {
            background: var(--accent-green);
            color: #0b1120;
            font-weight: 800;
            font-size: 0.68rem;
            padding: 3px 6px;
            border-radius: 4px;
            white-space: nowrap;
          }

          .manual-garmin-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: var(--radius-md);
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
          }

          .manual-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
          }

          .manual-header h3 {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--accent-green);
          }

          .badge-green {
            background: rgba(16, 185, 129, 0.2);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
          }

          .stat-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
          }

          .stat-icon {
            font-size: 1.4rem;
          }

          .stat-info {
            display: flex;
            flex-direction: column;
          }

          .stat-value {
            font-size: 1.1rem;
            font-weight: 800;
          }

          .stat-label {
            font-size: 0.68rem;
            color: var(--text-muted);
          }

          /* Simulator */
          .simulator-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
          }

          .simulator-box h3 {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent-cyan);
          }

          .sim-row {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 0.75rem;
          }

          .sim-row input[type="range"] {
            accent-color: var(--accent-cyan);
          }

          /* Forms & Inputs */
          .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
          }

          .full-width {
            grid-column: span 2;
          }

          .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
          }

          .form-group label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
          }

          input, select {
            background: rgba(11, 17, 32, 0.8);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-sm);
            color: #fff;
            padding: 9px 12px;
            font-family: inherit;
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s ease;
          }

          input:focus, select:focus {
            border-color: var(--accent-green);
          }

          /* Buttons */
          .btn {
            border: none;
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.15s ease;
          }

          .btn:active {
            transform: scale(0.98);
          }

          .btn-primary {
            background: var(--accent-green);
            color: #0b1120;
          }

          .btn-secondary {
            background: var(--accent-cyan);
            color: #0b1120;
          }

          .btn-outline {
            background: transparent;
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
          }

          .btn-full {
            width: 100%;
          }

          /* Presets row */
          .presets-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
          }

          .preset-label {
            font-size: 0.72rem;
            color: var(--text-muted);
            font-weight: 700;
            width: 100%;
          }

          .chip {
            background: var(--card-border);
            border: none;
            color: var(--text-main);
            padding: 5px 9px;
            border-radius: 12px;
            font-size: 0.72rem;
            font-weight: 600;
            cursor: pointer;
          }

          .chip:active {
            background: var(--accent-green);
            color: #0b1120;
          }

          /* Meal List Items */
          .meals-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
          }

          .meal-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
          }

          .meal-title {
            font-size: 0.85rem;
            font-weight: 700;
          }

          .meal-sub {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 2px;
          }

          .meal-del-btn {
            background: transparent;
            border: none;
            color: var(--accent-red);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 4px;
          }

          /* Ketone logs */
          .ketone-logs-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
          }

          .ketone-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
          }

          /* Modal */
          .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 16px;
          }

          .modal-backdrop.show {
            display: flex;
          }

          .modal-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 20px;
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-height: 90vh;
            overflow-y: auto;
          }

          .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
          }

          .modal-header h2 {
            font-size: 1.1rem;
          }

          .btn-close {
            background: transparent;
            border: none;
            font-size: 1.5rem;
            color: var(--text-muted);
            cursor: pointer;
          }

          .divider {
            border: 0;
            height: 1px;
            background: var(--card-border);
            margin: 6px 0;
          }

          .text-center { text-align: center; }

          /* AI Camera Scanner Box */
          .camera-scanner-box {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.08), rgba(139, 92, 246, 0.08));
            border: 1px solid rgba(6, 182, 212, 0.3);
            border-radius: var(--radius-md);
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
          }

          .btn-ai-camera {
            background: linear-gradient(135deg, #06b6d4, #8b5cf6);
            color: #fff;
            font-weight: 700;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            box-shadow: 0 4px 14px rgba(6, 182, 212, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
          }

          .camera-icon {
            font-size: 1.25rem;
          }

          .analysis-loading {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-radius: var(--radius-sm);
          }

          .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(6, 182, 212, 0.2);
            border-top-color: var(--accent-cyan);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            flex-shrink: 0;
          }

          @keyframes spin {
            to { transform: rotate(360deg); }
          }

          .loading-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
            font-size: 0.8rem;
          }

          .photo-preview-wrap {
            display: flex;
            flex-direction: column;
            gap: 8px;
          }

          .preview-img-container {
            width: 100%;
            max-height: 180px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            border: 1px solid var(--card-border);
          }

          #imgMealPreview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
          }

          .ai-advice-banner {
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.35);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            font-size: 0.76rem;
            color: #a7f3d0;
            line-height: 1.35;
          }

          .input-highlight {
            animation: pulseHighlight 1.5s ease-out;
          }

          @keyframes pulseHighlight {
            0% { background-color: rgba(6, 182, 212, 0.35); border-color: var(--accent-cyan); }
            100% { background-color: rgba(11, 17, 32, 0.8); border-color: var(--card-border); }
          }



          /* ==========================================================================
             NUEVOS ESTILOS: REDISEÑO PREMIUM, FUEGO, IA Y SEGUIMIENTO DE PESO
             ========================================================================== */

          /* Header Sync Pill con Luz Verde Pulsante */
          .header-sync-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.4);
            border-radius: 20px;
            padding: 2px 8px;
            font-size: 0.7rem;
            color: #a7f3d0;
            margin-top: 3px;
            font-weight: 600;
          }

          .pulse-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: #10b981;
            box-shadow: 0 0 8px #10b981;
            animation: pulseDot 2s infinite ease-in-out;
            flex-shrink: 0;
          }

          @keyframes pulseDot {
            0% { transform: scale(0.9); opacity: 0.8; box-shadow: 0 0 4px #10b981; }
            50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 12px #10b981; }
            100% { transform: scale(0.9); opacity: 0.8; box-shadow: 0 0 4px #10b981; }
          }


          /* Banner Longitudinal del Protocolo Keto (Día 1, 2, 3...) */
          .protocol-day-banner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.95));
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            margin-bottom: 14px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
          }

          .protocol-day-left {
            display: flex;
            align-items: center;
            gap: 12px;
          }

          .protocol-day-tag {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: #fff;
            font-weight: 800;
            font-size: 0.85rem;
            padding: 6px 12px;
            border-radius: 8px;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.35);
            white-space: nowrap;
          }

          .protocol-day-info h4 {
            font-size: 0.92rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 2px;
          }

          .protocol-day-sub {
            font-size: 0.72rem;
            color: var(--text-muted);
          }

          .btn-protocol-edit {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-main);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
            white-space: nowrap;
          }

          .btn-protocol-edit:hover {
            background: rgba(255, 255, 255, 0.15);
          }

          /* Pronóstico Reloj Predictivo a Cetosis */
          .countdown-forecast-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 8px;
            padding: 8px 12px;
            margin-bottom: 8px;
          }

          .forecast-icon {
            font-size: 1.25rem;
          }

          .forecast-content {
            display: flex;
            flex-direction: column;
          }

          .forecast-label {
            font-size: 0.68rem;
            color: #94a3b8;
            font-weight: 600;
          }

          .forecast-datetime {
            font-size: 0.88rem;
            color: #38bdf8;
            font-weight: 700;
          }

          .flame-milestone {
            font-size: 0.72rem;
            color: #fed7aa;
            background: rgba(0, 0, 0, 0.25);
            padding: 3px 8px;
            border-radius: 4px;
            display: inline-block;
            margin-top: 5px;
          }

          .badge-harvard {
            background: rgba(168, 85, 247, 0.2);
            color: #c084fc;
            border: 1px solid rgba(168, 85, 247, 0.4);
          }

          /* MODO FUEGO: Cetosis Activa */
          .ketosis-flame-box {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.16), rgba(245, 158, 11, 0.22));
            border: 1px solid rgba(245, 158, 11, 0.6);
            border-radius: var(--radius-md);
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 16px;
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.25);
            animation: flameGlow 2.5s ease-in-out infinite alternate;
          }

          @keyframes flameGlow {
            0% { box-shadow: 0 0 15px rgba(245, 158, 11, 0.2); border-color: rgba(245, 158, 11, 0.4); }
            100% { box-shadow: 0 0 30px rgba(239, 68, 68, 0.35); border-color: rgba(239, 68, 68, 0.7); }
          }

          .flame-animation-wrap {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            flex-shrink: 0;
          }

          .flame-emoji {
            font-size: 2.5rem;
            animation: flameShake 1.2s ease-in-out infinite alternate;
            transform-origin: center bottom;
          }

          @keyframes flameShake {
            0% { transform: rotate(-4deg) scale(0.98); }
            100% { transform: rotate(4deg) scale(1.08); }
          }

          .flame-badge {
            background: linear-gradient(135deg, #ef4444, #f59e0b);
            color: #fff;
            font-weight: 800;
            font-size: 0.72rem;
            padding: 3px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            display: inline-block;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
          }

          .flame-info h3 {
            font-size: 1.05rem;
            font-weight: 800;
            color: #fef08a;
            margin-bottom: 3px;
          }

          .flame-info p {
            font-size: 0.75rem;
            color: #fed7aa;
            line-height: 1.35;
          }

          /* MODO CUENTA REGRESIVA A CETOSIS */
          .ketosis-countdown-box {
            background: rgba(2, 132, 199, 0.12);
            border: 1px solid rgba(2, 132, 199, 0.4);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            margin-bottom: 16px;
          }

          .countdown-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
          }

          .countdown-label {
            font-size: 0.72rem;
            font-weight: 700;
            color: #38bdf8;
            letter-spacing: 0.5px;
          }

          .countdown-time {
            font-size: 1.15rem;
            font-weight: 800;
            color: #f8fafc;
          }

          .countdown-bar-wrap {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 6px;
          }

          .countdown-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #0284c7, #38bdf8);
            border-radius: 4px;
            transition: width 0.4s ease, background 0.4s ease;
          }

          .countdown-caption {
            font-size: 0.75rem;
            color: var(--text-muted);
            line-height: 1.3;
          }

          /* Subtítulo de macros personalizados */
          .sub-personal {
            font-size: 0.72rem;
            color: var(--accent-cyan);
            font-weight: 600;
            display: block;
            margin-top: 2px;
          }

          /* Botón y Banner de IA Nutricional en Comidas */
          .input-with-action {
            display: flex;
            gap: 8px;
          }

          .input-with-action input {
            flex: 1;
          }

          .btn-ai-calc {
            background: linear-gradient(135deg, #8b5cf6, #3b82f6);
            color: #fff;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 10px 14px;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
          }

          .btn-ai-calc:active {
            transform: scale(0.94);
          }

          .ai-feedback-banner {
            background: rgba(139, 92, 246, 0.14);
            border: 1px solid rgba(139, 92, 246, 0.45);
            color: #c4b5fd;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            font-size: 0.78rem;
            line-height: 1.4;
            margin-top: 8px;
          }

          .badge-ai {
            background: linear-gradient(135deg, #8b5cf6, #3b82f6);
            color: #fff;
          }

          /* Elementos del Historial de Comidas Mejorado */
          .meal-item-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            background: rgba(19, 29, 51, 0.6);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
            transition: border-color 0.2s ease;
          }

          .meal-item-card:hover {
            border-color: rgba(255, 255, 255, 0.15);
          }

          .meal-item-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
          }

          .meal-header-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
          }

          .meal-title-text {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-main);
          }

          .meal-time-tag {
            font-size: 0.68rem;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-muted);
            padding: 2px 7px;
            border-radius: 12px;
            font-weight: 600;
          }

          .meal-macros-chips {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            font-size: 0.74rem;
          }

          .macro-chip {
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
          }

          .macro-chip-carb { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
          .macro-chip-fat { background: rgba(16, 185, 129, 0.15); color: #34d399; }
          .macro-chip-prot { background: rgba(6, 182, 212, 0.15); color: #38bdf8; }
          .macro-chip-cal { background: rgba(255, 255, 255, 0.06); color: #94a3b8; }

          .btn-delete-meal {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #f87171;
            width: 34px;
            height: 34px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s ease, transform 0.1s ease;
            margin-left: 10px;
            flex-shrink: 0;
          }

          .btn-delete-meal:hover {
            background: rgba(239, 68, 68, 0.3);
          }

          .btn-delete-meal:active {
            transform: scale(0.9);
          }

          /* Pantalla Garmin Limpia */
          .garmin-clean-card {
            padding: 18px;
          }

          .garmin-title-box {
            display: flex;
            align-items: center;
            gap: 10px;
          }

          .garmin-auto-banner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            margin-top: 8px;
          }

          .auto-banner-left {
            display: flex;
            align-items: center;
            gap: 10px;
          }

          .garmin-privacy-note {
            font-size: 0.75rem;
            color: var(--text-muted);
            background: rgba(0, 0, 0, 0.25);
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--card-border);
            margin-top: 14px;
            line-height: 1.4;
          }

          /* Pantalla de Seguimiento de Peso */
          .weight-summary-card {
            padding: 18px;
          }

          .weight-hero-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 14px 0;
            gap: 16px;
          }

          .weight-main-display {
            display: flex;
            align-items: baseline;
            gap: 4px;
          }

          .weight-big-number {
            font-size: 2.8rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: -1px;
          }

          .weight-big-unit {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-cyan);
          }

          .weight-submetrics {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
          }

          .weight-pill {
            font-size: 0.78rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 5px 10px;
            border-radius: 6px;
            border: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
          }

          .weight-sync-tip {
            font-size: 0.74rem;
            color: var(--text-muted);
            background: rgba(6, 182, 212, 0.08);
            border: 1px solid rgba(6, 182, 212, 0.25);
            padding: 8px 12px;
            border-radius: 6px;
            line-height: 1.35;
          }

          /* Métricas de Contraste Metabólico en Peso (Real vs Ideal) */
          .weight-contrast-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin: 14px 0 12px 0;
          }

          @media (min-width: 480px) {
            .weight-contrast-grid {
              grid-template-columns: repeat(4, 1fr);
            }
          }

          .weight-contrast-box {
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-width: 0;
          }

          .w-lbl {
            font-size: 0.65rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
          }

          .w-val {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--text-main);
            white-space: nowrap;
          }

          .w-sub {
            font-size: 0.68rem;
            color: var(--text-muted);
            white-space: nowrap;
          }

          /* Gráfica de Doble Curva Real vs Ideal */
          .weight-chart-card {
            padding: 18px;
          }

          .canvas-wrapper-weight {
            height: 250px;
          }

          .legend-line-sample {
            display: inline-block;
            width: 14px;
            height: 2px;
            background-color: #38bdf8;
            margin-right: 4px;
          }

          /* Tarjetas Semanales de Contraste */
          .weekly-cards-wrap {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
          }

          .weekly-card {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: transform 0.2s ease, border-color 0.2s ease;
          }

          .weekly-card:hover {
            border-color: rgba(56, 189, 248, 0.35);
          }

          .weekly-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
          }

          .weekly-card-title {
            display: flex;
            align-items: baseline;
            gap: 8px;
          }

          .weekly-card-title strong {
            font-size: 0.95rem;
            font-weight: 800;
            color: #f8fafc;
          }

          .weekly-card-title span {
            font-size: 0.72rem;
            color: var(--text-muted);
          }

          .weekly-card-body {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            background: rgba(0, 0, 0, 0.22);
            border-radius: var(--radius-sm);
            padding: 10px;
          }

          .weekly-col {
            display: flex;
            flex-direction: column;
            gap: 2px;
          }

          .weekly-col-lbl {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
          }

          .weekly-col-val {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--text-main);
          }

          .weekly-garmin-strip {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.72rem;
            color: var(--text-muted);
            background: rgba(16, 185, 129, 0.06);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 6px;
            padding: 6px 10px;
          }

          .badge-purple {
            background: rgba(168, 85, 247, 0.15);
            color: #c084fc;
            border: 1px solid rgba(168, 85, 247, 0.35);
          }

          .loading-placeholder {
            text-align: center;
            padding: 24px;
            color: var(--text-muted);
            font-size: 0.85rem;
          }

          .weight-item-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            background: rgba(19, 29, 51, 0.5);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
          }

          .weight-item-left {
            display: flex;
            align-items: baseline;
            gap: 8px;
          }

          .weight-item-val {
            font-weight: 800;
            font-size: 1.15rem;
            color: #fff;
          }

          .weight-item-date {
            font-size: 0.72rem;
            color: var(--text-muted);
          }


          /* ==========================================================================
             ESTILOS: WIDGET DE PASOS PARA CETOSIS Y MODAL DE BASES CIENTÍFICAS
             ========================================================================== */

          .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
          }

          /* Tarjeta de Pasos para Cetosis */
          .steps-keto-card {
            padding: 16px 18px;
            border-left: 4px solid var(--accent-green);
            transition: border-color 0.3s ease;
          }

          .steps-hero-row {
            display: flex;
            flex-direction: column;
          }

          .steps-progress-numbers {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
          }

          .step-num-group {
            display: flex;
            align-items: baseline;
            gap: 3px;
          }

          .step-big-val {
            font-size: 1.9rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.5px;
          }

          .step-divider {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin: 0 2px;
          }

          .step-target-val {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-muted);
          }

          .step-unit {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-left: 4px;
          }

          .step-percent-tag {
            font-size: 0.85rem;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 6px;
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
          }

          .steps-feedback-box {
            background: rgba(0, 0, 0, 0.28);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            margin: 6px 0;
            line-height: 1.35;
          }

          .feedback-title {
            font-size: 0.88rem;
            font-weight: 700;
            margin-bottom: 2px;
          }

          .feedback-desc {
            font-size: 0.76rem;
            color: var(--text-muted);
          }

          .steps-science-footnote {
            font-size: 0.68rem;
            color: var(--text-muted);
            margin-top: 4px;
            font-style: italic;
            line-height: 1.3;
          }

          /* Modal de Bases Científicas */
          .modal-science-card {
            max-width: 580px;
            max-height: 88vh;
            display: flex;
            flex-direction: column;
          }

          .modal-body-scroll {
            overflow-y: auto;
            padding: 8px 4px 16px 4px;
            display: flex;
            flex-direction: column;
            gap: 12px;
          }

          .intro-science {
            font-size: 0.82rem;
            color: var(--text-muted);
            line-height: 1.45;
            margin-bottom: 4px;
          }

          .science-source-box {
            background: rgba(11, 17, 32, 0.85);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
          }

          .source-header {
            display: flex;
            align-items: center;
            gap: 8px;
          }

          .source-header h3 {
            font-size: 0.92rem;
            font-weight: 700;
            color: #fff;
          }

          .source-badge {
            font-size: 0.68rem;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
          }

          .badge-who { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.4); }
          .badge-acsm { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); }
          .badge-ajcn { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
          .badge-fao { background: rgba(139, 92, 246, 0.2); color: #c084fc; border: 1px solid rgba(139, 92, 246, 0.4); }
          .badge-ada { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }

          .science-source-box p {
            font-size: 0.78rem;
            color: #e2e8f0;
            line-height: 1.35;
          }

          .science-source-box ul {
            padding-left: 18px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 0.76rem;
            color: var(--text-muted);
            line-height: 1.4;
          }

          .science-source-box code {
            background: rgba(255, 255, 255, 0.08);
            color: #a7f3d0;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.73rem;
            font-family: monospace;
          }


          /* Barra de Navegación con Scroll Horizontal Fluido */
          .nav-tabs {
            display: flex !important;
            gap: 6px !important;
            overflow-x: auto !important;
            -webkit-overflow-scrolling: touch !important;
            scrollbar-width: none !important;
            padding-bottom: 4px !important;
          }

          .nav-tabs::-webkit-scrollbar {
            display: none !important;
          }

          .nav-tab {
            flex: 0 0 auto !important;
            min-width: fit-content !important;
            padding: 8px 12px !important;
            font-size: 0.8rem !important;
          }

          /* Botón Iniciar Proceso Superior */
          .btn-start-process {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.35);
            transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;
          }

          .btn-start-process:hover {
            background: linear-gradient(135deg, #0369a1, #1d4ed8);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.5);
          }

          .btn-start-process:active {
            transform: scale(0.95);
          }

          /* Modal Iniciar Proceso */
          .modal-process-card {
            max-width: 480px;
          }

          .process-modal-title {
            display: flex;
            align-items: center;
            gap: 10px;
          }

          .process-icon {
            font-size: 1.8rem;
          }

          .process-modal-intro {
            font-size: 0.82rem;
            color: var(--text-muted);
            line-height: 1.45;
            margin-bottom: 14px;
          }

          .process-action-cards {
            display: flex;
            flex-direction: column;
            gap: 10px;
          }

          .process-card-opt {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
          }

          .process-card-opt:hover {
            background: rgba(30, 41, 59, 0.95);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
          }

          .opt-icon {
            font-size: 1.6rem;
            flex-shrink: 0;
          }

          .opt-details {
            display: flex;
            flex-direction: column;
            gap: 3px;
            flex: 1;
          }

          .opt-details strong {
            font-size: 0.9rem;
            color: var(--text-main);
          }

          .opt-details span {
            font-size: 0.73rem;
            color: var(--text-muted);
            line-height: 1.3;
          }

          .opt-badge {
            font-size: 0.65rem;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 6px;
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.35);
            white-space: nowrap;
          }

          .opt-badge.badge-danger {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border-color: rgba(239, 68, 68, 0.35);
          }

          .opt-keep {
            border-left: 4px solid #10b981;
          }

          .opt-reset {
            border-left: 4px solid #ef4444;
          }

          /* ESTILOS DE LA PESTAÑA DE GRÁFICAS */
          .charts-card {
            padding: 16px;
          }

          .time-range-toggle {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 2px;
          }

          .toggle-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 5px 10px;
            font-size: 0.72rem;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
          }

          .toggle-btn.active {
            background: var(--accent-green);
            color: #0b1120;
            box-shadow: 0 2px 6px rgba(16, 185, 129, 0.3);
          }

          .chart-metric-selector {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            scrollbar-width: none;
            margin-bottom: 12px;
            padding-bottom: 2px;
          }

          .chart-metric-selector::-webkit-scrollbar {
            display: none;
          }

          .metric-pill {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            transition: all 0.2s ease;
          }

          .metric-pill.active {
            background: rgba(56, 189, 248, 0.15);
            border-color: #38bdf8;
            color: #38bdf8;
          }

          .chart-summary-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 14px;
          }

          .summary-stat-box {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-sm);
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 2px;
          }

          .sum-lbl {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
          }

          .sum-val {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--text-main);
          }

          .chart-canvas-box {
            background: rgba(11, 17, 32, 0.85);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
          }

          .chart-legend {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 0.72rem;
            margin-bottom: 4px;
          }

          .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-main);
          }

          .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
          }

          .canvas-wrapper {
            position: relative;
            width: 100%;
            height: 230px;
          }

          #canvasKetoChart {
            width: 100%;
            height: 100%;
            display: block;
          }

          .chart-hint-footer {
            font-size: 0.68rem;
            color: var(--text-muted);
            text-align: right;
            font-style: italic;
          }

          .chart-history-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
          }

          .history-day-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            background: rgba(19, 29, 51, 0.6);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-sm);
            font-size: 0.76rem;
          }

          .history-day-left {
            display: flex;
            flex-direction: column;
            gap: 2px;
          }

          .history-day-date {
            font-weight: 700;
            color: var(--text-main);
          }

          .history-day-detail {
            font-size: 0.68rem;
            color: var(--text-muted);
          }

          .history-day-metrics {
            display: flex;
            gap: 8px;
            font-weight: 700;
          }

          /* ==========================================================================
             SISTEMA DE NAVEGACIÓN MODERNO INFERIOR (GLASS BOTTOM DOCK) & FIX OVERFLOWS
             ========================================================================== */

          /* Header con Logos y Botones SVG */
          .logo-icon-svg {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
          }

          .btn-icon svg {
            display: block;
          }

          /* Barra Inferior Fija (Bottom Dock) */
          .app-bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 500px;
            background: rgba(11, 17, 32, 0.94);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)) 4px;
            z-index: 1000;
            box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.55);
            box-sizing: border-box;
          }

          .nav-tab {
            flex: 1;
            background: transparent;
            border: none;
            color: #64748b;
            font-family: inherit;
            padding: 5px 2px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            min-width: 0;
            -webkit-tap-highlight-color: transparent;
          }

          .nav-tab-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            transition: transform 0.2s ease, color 0.2s ease;
          }

          .nav-tab-icon svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
          }

          .nav-tab-label {
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.2px;
            white-space: nowrap;
            transition: color 0.2s ease;
          }

          .nav-tab.active {
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.08);
          }

          .nav-tab.active .nav-tab-icon {
            transform: translateY(-2px);
            color: #38bdf8;
            filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.6));
          }

          .nav-tab.active .nav-tab-label {
            color: #f8fafc;
            font-weight: 700;
          }

          .nav-tab:active {
            transform: scale(0.92);
          }

          /* Asegurar padding en el contenedor para que nada quede tapado */
          .app-container {
            padding-bottom: 86px !important;
          }

          /* SELECTOR DE MÉTRICA EN GRÁFICAS - 3 COLUMNAS RESPONSIVAS QUE NUNCA SE CORTAN */
          .chart-metric-selector {
            display: grid !important;
            grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
            gap: 6px !important;
            background: rgba(15, 23, 42, 0.7) !important;
            border: 1px solid var(--card-border) !important;
            border-radius: 10px !important;
            padding: 4px !important;
            margin-bottom: 12px !important;
            width: 100% !important;
            box-sizing: border-box !important;
          }

          .metric-pill {
            background: transparent !important;
            border: 1px solid transparent !important;
            color: var(--text-muted) !important;
            padding: 7px 4px !important;
            border-radius: 7px !important;
            font-size: 0.75rem !important;
            font-weight: 700 !important;
            cursor: pointer !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 5px !important;
            white-space: nowrap !important;
            transition: all 0.2s ease !important;
            min-width: 0 !important;
            overflow: hidden !important;
          }

          .metric-pill span {
            overflow: hidden;
            text-overflow: ellipsis;
          }

          .metric-pill .pill-svg {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
          }

          .metric-pill.active {
            background: rgba(56, 189, 248, 0.15) !important;
            border-color: #38bdf8 !important;
            color: #38bdf8 !important;
            box-shadow: 0 2px 6px rgba(56, 189, 248, 0.2) !important;
          }

          /* Cabecera de Gráficas responsiva */
          .charts-header-title {
            display: flex !important;
            flex-wrap: wrap !important;
            justify-content: space-between !important;
            align-items: center !important;
            gap: 8px !important;
          }

          .chart-summary-stats {
            display: grid !important;
            grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
            gap: 6px !important;
            margin-bottom: 14px !important;
          }

          .summary-stat-box {
            background: rgba(15, 23, 42, 0.6) !important;
            border: 1px solid var(--card-border) !important;
            border-radius: var(--radius-sm) !important;
            padding: 8px 6px !important;
            display: flex !important;
            flex-direction: column !important;
            gap: 2px !important;
            min-width: 0 !important;
            text-align: center !important;
          }

          .sum-lbl {
            font-size: 0.64rem !important;
            color: var(--text-muted) !important;
            text-transform: uppercase !important;
            font-weight: 600 !important;
            white-space: nowrap !important;
            overflow: hidden !important;
            text-overflow: ellipsis !important;
