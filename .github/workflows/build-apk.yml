name: Compilar APK Android (KetoTrack)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Compilar APK Android 15 (Health Connect)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 21 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Instalar y Compilar APK con Health Connect
        run: |
          # Detectar si los archivos están en subdirectorio keto-tracker o en la raíz
          if [ -d "keto-tracker" ]; then
            cd keto-tracker
          fi

          # 1. Respaldar manifiesto con permisos de Health Connect
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml || true
          rm -rf android

          # 2. Instalar dependencias oficiales de Capacitor 7 y Health Connect
          npm install

          # 3. Generar proyecto nativo Android limpio
          npx cap add android

          # 4. Restaurar manifiesto con permisos de Health Connect
          if [ -f "/tmp/AndroidManifest.xml" ]; then
            cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi

          # 5. Sincronizar plugins y copiar assets web
          npx cap sync android

          # 6. Compilar APK Debug
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Guardar APK como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: KetoTrack-Android-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            keto-tracker/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
