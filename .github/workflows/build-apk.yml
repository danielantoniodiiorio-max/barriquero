name: Compilar APK Android (KetoTrack)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Compilar APK Android 15
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurar Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Dependencias del Proyecto
        run: npm ci

      - name: Inicializar y Sincronizar Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Compilar APK con Gradle
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Guardar APK como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: KetoTrack-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
